<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Record Lens</title>
<style>
/* The page loads nothing from the network: fonts are the system's, script and data inline. */
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --ink: #17212b;
  --muted: #5b6875;
  --line: #d6dde3;
  --accent: #1d6b8a;
  --accent-soft: #dcecf3;
  --down: #7a4fb0;
  --down-soft: #ece4f6;
  --good: #2f7d4f;
  --warn: #8a5608;
  --bad: #b23b3b;
  --bar: #7fa8bd;
  --display: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171c; --panel: #182129; --ink: #e5ebf0; --muted: #94a3b0; --line: #2a3742;
    --accent: #5fb2d3; --accent-soft: #173445; --down: #b593e0; --down-soft: #2c2340;
    --good: #5fbf85; --warn: #e0a64a; --bad: #ec7b7b; --bar: #4f7d94; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171c; --panel: #182129; --ink: #e5ebf0; --muted: #94a3b0; --line: #2a3742;
  --accent: #5fb2d3; --accent-soft: #173445; --down: #b593e0; --down-soft: #2c2340;
  --good: #5fbf85; --warn: #e0a64a; --bad: #ec7b7b; --bar: #4f7d94; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); }
[hidden] { display: none !important; }
.wrap { padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font: 600 26px/1.1 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 65ch; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, button, .file { font: 500 13px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
button:hover, .file:hover, select:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.file { position: relative; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.summary { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.kv { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.k { font: 500 11px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.v { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.chip { font: 600 11px var(--display); text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.good { color: var(--good); } .chip.bad { color: var(--bad); } .chip.warn { color: var(--warn); } .chip.info { color: var(--accent); }
.notice { color: var(--warn); font-size: 13px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.flow { overflow-x: auto; padding: 4px 4px 6px; }
.cols { display: flex; gap: 14px; align-items: flex-start; min-width: min-content; }
.col { width: 270px; flex: none; display: grid; gap: 8px; }
.colhead { font: 600 13px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: grid; gap: 6px; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
.card:hover { border-color: var(--accent); }
.card.call { border-style: dashed; }
.card.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.card.up { background: var(--accent-soft); border-color: var(--accent); }
.card.down { background: var(--down-soft); border-color: var(--down); }
.card.dim { opacity: .45; }
.ref { font: 500 12.5px var(--mono); overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.bars { display: grid; gap: 3px; }
.bar { display: grid; grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) 3.4em; gap: 6px; align-items: center; font-size: 12px; }
.bar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--bar); }
.bar.top .fill { background: var(--accent); }
.bar.top .lab { font-weight: 600; }
.pct { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--mono); font-size: 11.5px; }
.val { font: 12px var(--mono); background: var(--bg); border-radius: 4px; padding: 4px 6px; overflow-wrap: anywhere; max-height: 7.5em; overflow: auto; white-space: pre-wrap; }
.marker { font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - 32px); overflow: auto; }
aside h2 { font: 600 15px var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
aside h3 { font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 2px; }
aside ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 4px; }
aside li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
aside li button { background: none; border: none; padding: 0; color: var(--accent); font: 500 12.5px var(--mono); text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.how { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
textarea { width: 100%; min-height: 110px; font: 12px var(--mono); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.paste { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.paste .row { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: var(--bad); font-size: 13px; }
.pager { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pager select { flex: 1 1 240px; min-width: 0; max-width: 100%; }
button:disabled { opacity: .4; cursor: default; }
@media (prefers-reduced-motion: no-preference) { .card { transition: background .15s, border-color .15s, opacity .15s; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Record Lens</h1>
      <p class="sub">ommat records laid out as they ran: each round's calls and entries, the answers as percentages, and where each value came from. Select any card to trace its lineage.</p>
    </div>
    <div class="controls">
      <label class="file" for="recFile">Open record…<input id="recFile" type="file" accept=".json,application/json"></label>
      <label class="file" for="dirFile">Open folder…<input id="dirFile" type="file" webkitdirectory multiple></label>
      <label class="file" for="desFile">Open design…<input id="desFile" type="file" accept=".json,application/json"></label>
      <button id="pasteBtn" type="button">Paste JSON</button>
    </div>
  </header>

  <div class="paste" id="pastePanel" hidden>
    <label class="k" for="pasteRec">Record document (the record's <code>document</code> bytes, or its <code>log</code>)</label>
    <textarea id="pasteRec" spellcheck="false" placeholder='{"hash": "sha256:…", "log": [ … ], "unhashed": { … }}'></textarea>
    <label class="k" for="pasteDes">Design document, optional (the loaded design's <code>document</code>)</label>
    <textarea id="pasteDes" spellcheck="false" placeholder='{"format": 6, "sources": { … }, "rules": { … }, "policy": { … }}'></textarea>
    <div class="row"><button id="pasteGo" type="button">Show this record</button><span class="err" id="pasteErr"></span></div>
  </div>

  <nav class="pager" id="pager" aria-label="Records" hidden>
    <button id="prev" type="button">‹ Previous</button>
    <select id="pick" aria-label="Record in this folder"></select>
    <span class="v" id="count"></span>
    <button id="next" type="button">Next ›</button>
    <span class="meta" id="deckNote"></span>
  </nav>

  <div class="summary" id="summary"></div>
  <div class="main">
    <div class="flow"><div class="cols" id="cols"></div></div>
    <aside id="lineage" aria-label="Lineage" aria-live="polite"></aside>
  </div>
</div>

<script id="lens-data" type="application/json">__OMMAT_LENS_DATA__</script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// Any value to escaped text: a hostile record's object or array shows as JSON, never throws.
const text = (s) => { if (typeof s === "string") return s; try { return typeof s === "object" && s !== null ? JSON.stringify(s) : String(s); } catch (e) { return "?"; } };
const esc = (s) => text(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (p) => (typeof p === "number" ? (p * 100).toFixed(p * 100 >= 99.95 || p * 100 < 0.05 ? 0 : 1) + "%" : "–");
const arr = (x) => (Array.isArray(x) ? x : []);
const obj = (x) => (x && typeof x === "object" && !Array.isArray(x) ? x : {});
const str = (x) => typeof x === "string";

// A ref's declared base: prefix and name, without a grounded bracket or a field path.
function parseRef(ref) {
  const m = /^([qtd]):([^.[\]]+)/.exec(str(ref) ? ref : "");
  if (!m) return { base: ref, candidate: null };
  let rest = ref.slice(m[0].length), candidate = null;
  if (rest.startsWith("[")) {
    // The bracket holds a JSON string; read it with a JSON parser, not by searching for ].
    let i = 1;
    for (; i < rest.length; i++) { if (rest[i] === "\\") { i++; continue; } if (rest[i] === '"' && i > 1) break; }
    try { candidate = JSON.parse(rest.slice(1, i + 1)); } catch (e) { candidate = rest.slice(1, i + 1); }
  }
  return { base: m[1] + ":" + m[2], candidate };
}

let state = null;

function build(record, design) {
  const log = Array.isArray(record) ? record : obj(record).log;
  if (!Array.isArray(log)) throw new Error("The record has no log: give the record document or its log.");
  design = design ? obj(design) : null;
  const items = log.map((it, idx) => [idx, it]).filter(([, it]) => it && typeof it === "object" && str(it.item));
  const unhashed = obj(!Array.isArray(record) && record.unhashed);
  const settings = obj((items.find(([, i]) => i.item === "settings") || [])[1]);
  const providers = obj(settings.providers);
  const grounded = obj(settings.grounded);
  const entries = new Map(), calls = new Map(), rounds = new Map();
  let plan = null, verdict = null;
  const col = (n) => { const k = Number.isInteger(n) ? n : "?"; if (!rounds.has(k)) rounds.set(k, { calls: [], entries: [] }); return rounds.get(k); };
  for (const [idx, it] of items) {
    if (it.item === "entry" && str(it.ref) && !entries.has(it.ref)) { entries.set(it.ref, { ...it, idx }); col(it.round).entries.push(it.ref); }
    else if (it.item === "call") { calls.set(idx, { ...it, idx }); col(it.round).calls.push(idx); }
    else if (it.item === "plan") plan = { ...it, idx };
    else if (it.item === "verdict") verdict = it;
  }
  const byBase = new Map();
  for (const r of entries.keys()) { const b = parseRef(r).base; if (!byBase.has(b)) byBase.set(b, []); byBase.get(b).push(r); }

  // Node ids: "e:<ref>" for an entry, "c:<index>" for a call, "plan".
  const inputs = new Map(); // node -> Map(from -> {node, how, src})
  const add = (node, from, how, src) => {
    if (!from || from === node) return;
    if (!inputs.has(node)) inputs.set(node, new Map());
    if (!inputs.get(node).has(from)) inputs.get(node).set(from, { node: from, how, src });
  };
  // A ref read, as the nodes holding it: its entry, or each grounded entry of a declared ref.
  const nodesOf = (ref) => {
    if (!str(ref)) return [];
    if (entries.has(ref)) return ["e:" + ref];
    const { base, candidate } = parseRef(ref);
    // A grounded ref with a field path reads its own candidate's entry.
    if (str(candidate) && entries.has(base + "[" + JSON.stringify(candidate) + "]")) return ["e:" + base + "[" + JSON.stringify(candidate) + "]"];
    if (entries.has(base)) return ["e:" + base];
    return (byBase.get(base) || []).map((r) => "e:" + r);
  };
  const link = (node, refs, how, src) => { for (const r of arr(refs)) for (const n of nodesOf(r)) add(node, n, how, src); };
  const sources = obj(design && design.sources), rules = obj(design && design.rules);
  const sourceInputs = (sid) => {
    const s = obj(sources[sid]);
    const refs = [...arr(s.needs)];
    for (const q of Object.values(obj(s.provides))) {
      const qq = obj(q);
      for (const slot of arr(obj(qq.wording).slots)) if (str(obj(obj(slot).origin).ref)) refs.push(slot.origin.ref);
      if (str(obj(qq.text).ref)) refs.push(qq.text.ref);
      if (str(obj(qq.reference_date).ref)) refs.push(qq.reference_date.ref);
    }
    if (str(s.grounded)) refs.push(s.grounded);
    return refs;
  };
  for (const [ref, e] of entries) {
    const node = "e:" + ref;
    const { base } = parseRef(ref);
    if (calls.has(e.call)) add(node, "c:" + e.call, "asked in this call", "record");
    if (Object.hasOwn(grounded, base) && str(grounded[base])) link(node, [grounded[base]], "its candidate set", "record");
    for (const d of arr(e.derivation)) link(node, obj(d).refs, "helper " + obj(d).helper, "record");
    link(node, obj(obj(e.marker).cause).refs, "named in its marker's cause", "record");
    const provider = Object.hasOwn(providers, base) ? providers[base] : undefined;
    if (ref.startsWith("d:") && str(provider) && Object.hasOwn(rules, provider)) link(node, obj(rules[provider]).reads, "rule " + provider + " reads it", "design");
  }
  for (const [idx, c] of calls) {
    link("c:" + idx, obj(obj(c.outcome).failed).refs, "named in its failure", "record");
    for (const sid of arr(c.sources)) {
      if (!str(sid) || !Object.hasOwn(sources, sid)) continue;
      link("c:" + idx, sourceInputs(sid), "source " + sid + " needs it", "design");
      link("c:" + idx, [obj(obj(sources[sid]).requirement).ref], "source " + sid + " is gated on it", "design");
    }
  }
  if (plan) {
    for (const d of arr(plan.derivation)) link("plan", obj(d).refs, "helper " + obj(d).helper, "record");
    link("plan", obj(plan.cause).refs, "named in the plan's cause", "record");
    for (const step of arr(plan.steps)) {
      for (const o of Object.values(obj(obj(step).arguments))) link("plan", [obj(o).ref], "a step's argument", "record");
      for (const q of arr(obj(step).requirements)) link("plan", [obj(q).ref], "a step's requirement", "record");
    }
    for (const c of arr(obj(plan.context).entries)) link("plan", [obj(c).ref], "a context entry", "record");
    for (const f of arr(obj(verdict).failures)) link("plan", [obj(f).ref, obj(obj(f).requirement).ref], "the guard refused on it", "record");
    if (design) link("plan", obj(design.policy).reads, "the policy reads it", "design");
  }
  const outputs = new Map();
  for (const [node, ins] of inputs) for (const i of ins.values()) {
    if (!outputs.has(i.node)) outputs.set(i.node, []);
    outputs.get(i.node).push({ node, how: i.how, src: i.src });
  }
  const flat = new Map([...inputs].map(([k, v]) => [k, [...v.values()]]));
  return { log, unhashed, settings, providers, grounded, entries, calls, plan, verdict, rounds, inputs: flat, outputs, design, record };
}

function reach(map, start) {
  const seen = new Set(), stack = [start];
  while (stack.length) for (const x of map.get(stack.pop()) || []) if (!seen.has(x.node)) { seen.add(x.node); stack.push(x.node); }
  return seen;
}

function valueHtml(e) {
  if (e.marker) {
    const m = obj(e.marker), c = obj(m.cause);
    const tone = m.kind === "Unavailable" ? "bad" : "warn";
    return `<div class="marker"><span class="chip ${tone}">${esc(m.kind ?? "marker")}</span><span class="v">${esc(c.code ?? "")}</span>${arr(c.refs).length ? `<span class="meta">${arr(c.refs).map(esc).join(", ")}</span>` : ""}</div>`;
  }
  const v = e.value;
  if (v === undefined) return `<div class="val">–</div>`;
  if (v && typeof v === "object" && v.probabilities && typeof v.probabilities === "object") {
    const probs = v.probabilities;
    const labels = arr(v.labels).length ? arr(v.labels) : Object.keys(probs);
    const top = labels.reduce((a, b) => ((probs[b] ?? -1) > (probs[a] ?? -1) ? b : a), labels[0]);
    return `<div class="bars">${labels.map((l) => {
      const p = probs[l], w = typeof p === "number" ? Math.max(0, Math.min(100, p * 100)) : 0;
      return `<div class="bar${l === top ? " top" : ""}"><span class="lab" title="${esc(l)}">${esc(l)}</span><span class="track"><span class="fill" style="display:block;width:${w}%"></span></span><span class="pct">${pct(p)}</span></div>`;
    }).join("")}</div>`;
  }
  if (v && typeof v === "object" && v.kind === "extraction") {
    const shown = v.value === null ? "none found" : v.value === undefined ? "–" : JSON.stringify(v.value);
    return `<div class="val">${esc(shown)}</div><div class="meta"><span>confidence ${pct(v.confidence)}</span><span>none: ${pct(v.p_null)}</span>${v.guess != null ? `<span>guess ${esc(JSON.stringify(v.guess))}</span>` : ""}</div>`;
  }
  return `<div class="val">${esc(JSON.stringify(v, null, 1))}</div>`;
}

const failureText = (f) => { const x = obj(f); return "step " + (x.step ?? "?") + (str(x.ref) ? " · " + x.ref : ""); };

function render() {
  const s = state;
  const design = obj((s.log.find((i) => obj(i).item === "design")));
  const plan = s.plan, verdict = s.verdict ? obj(s.verdict) : null;
  const vtone = !verdict || !str(verdict.kind) ? "warn" : verdict.kind === "passed" ? "good" : "bad";
  const designName = s.design && s.design.name;
  const hash = (h) => (str(h) ? esc(h.slice(0, 19)) + "…" : "–");
  $("summary").innerHTML = [
    designName ? `<div class="kv"><span class="k">Design</span><span class="v">${esc(designName)}</span></div>` : "",
    `<div class="kv"><span class="k">Design hash</span><span class="v">${hash(design.hash)}</span></div>`,
    s.record && str(s.record.hash) ? `<div class="kv"><span class="k">Record</span><span class="v">${hash(s.record.hash)}</span></div>` : "",
    `<div class="kv"><span class="k">Format</span><span class="v">${esc(design.format ?? "?")}</span></div>`,
    plan ? `<div class="kv"><span class="k">Plan</span><span class="chip info">${esc(plan.kind ?? "?")}</span></div>` : "",
    `<div class="kv"><span class="k">Verdict</span><span class="chip ${vtone}">${esc(verdict ? verdict.kind ?? "?" : "none")}</span></div>`,
    plan && (plan.reason || plan.reply) ? `<div class="kv"><span class="k">${plan.reason ? "Reason" : "Reply"}</span><span>${esc(plan.reason || plan.reply)}</span></div>` : "",
    s.design ? "" : `<div class="notice">No design loaded: lineage shows only what the record holds. Open the design to see what each rule and source read.</div>`,
  ].join("");

  const order = [...s.rounds.keys()].sort((a, b) => (a === "?") - (b === "?") || a - b);
  let html = "";
  for (const n of order) {
    const r = s.rounds.get(n);
    html += `<section class="col"><div class="colhead"><span>${n === "?" ? "No round" : "Round " + esc(n)}</span><span>${r.entries.length} entr${r.entries.length === 1 ? "y" : "ies"}</span></div>`;
    for (const idx of r.calls) {
      const c = s.calls.get(idx);
      const un = obj(obj(s.unhashed.calls)[idx]);
      const failed = obj(c.outcome).failed;
      html += `<div role="button" tabindex="0" aria-pressed="false" class="card call" data-node="c:${idx}"><span class="k">Call · ${esc(arr(c.sources).join(", "))}</span>
        <span class="meta">${failed ? `<span class="chip bad">failed ${esc(obj(failed).code ?? "")}</span>` : `<span>returned</span>`}${c.provider ? `<span>${esc(c.provider)}</span>` : ""}${c.model_reported || c.model_requested ? `<span>${esc(c.model_reported || c.model_requested)}</span>` : ""}${typeof un.latency === "number" ? `<span>${un.latency.toFixed(2)} s</span>` : ""}${c.precision != null ? `<span>precision ${esc(JSON.stringify(c.precision))}</span>` : ""}</span>
        <span class="meta">${Object.keys(obj(c.questions)).map(esc).join(" · ")}</span></div>`;
    }
    for (const ref of r.entries) {
      const e = s.entries.get(ref);
      const { base, candidate } = parseRef(ref);
      const who = (Object.hasOwn(s.providers, base) && s.providers[base]) || (ref === "t:state" ? "the state" : "");
      html += `<div role="button" tabindex="0" aria-pressed="false" class="card" data-node="e:${esc(ref)}"><span class="ref">${esc(ref)}</span>
        <span class="meta">${who ? `<span>from ${esc(who)}</span>` : ""}${candidate != null ? `<span>candidate ${esc(candidate)}</span>` : ""}</span>${valueHtml(e)}</div>`;
    }
    html += `</section>`;
  }
  if (plan) {
    const steps = arr(plan.steps).map((st, i) => `<div class="val">${i + 1}. ${esc(obj(st).tool ?? "?")} ${esc(JSON.stringify(obj(st).arguments ?? {}))}</div>`).join("");
    const fails = verdict && arr(verdict.failures).length ? `<div class="meta">${arr(verdict.failures).map((f) => esc(failureText(f))).join(" · ")}</div>` : "";
    html += `<section class="col"><div class="colhead"><span>Decision</span><span></span></div>
      <div role="button" tabindex="0" aria-pressed="false" class="card" data-node="plan"><span class="ref">plan · ${esc(plan.kind ?? "?")}</span>
      ${plan.reason ? `<span>${esc(plan.reason)}</span>` : ""}${plan.reply ? `<span>${esc(plan.reply)}</span>` : ""}
      ${plan.cause ? `<div class="marker"><span class="chip warn">cause</span><span class="v">${esc(obj(plan.cause).code ?? "")}</span></div>` : ""}${steps}
      <span class="meta"><span class="chip ${vtone}">${esc(verdict ? verdict.kind ?? "?" : "no verdict")}</span></span>${fails}</div></section>`;
  }
  $("cols").innerHTML = html;
  select(null);
}

const label = (node) => node === "plan" ? "plan" : node.startsWith("c:") ? "call · " + arr(state.calls.get(+node.slice(2)).sources).join(", ") : node.slice(2);
const cardOf = (node) => [...$("cols").querySelectorAll("[data-node]")].find((el) => el.dataset.node === node);

function select(node) {
  const up = node && state ? reach(state.inputs, node) : new Set();
  const down = node && state ? reach(state.outputs, node) : new Set();
  for (const el of $("cols").querySelectorAll("[data-node]")) {
    const n = el.dataset.node;
    el.classList.toggle("sel", n === node);
    el.setAttribute("aria-pressed", String(n === node));
    el.classList.toggle("up", up.has(n));
    el.classList.toggle("down", down.has(n));
    el.classList.toggle("dim", !!node && n !== node && !up.has(n) && !down.has(n));
  }
  const list = (items) => items && items.length
    ? `<ul>${items.map((i) => `<li><button type="button" data-go="${esc(i.node)}">${esc(label(i.node))}</button><span class="how">${esc(i.how)} · ${i.src}</span></li>`).join("")}</ul>`
    : `<p class="meta">None</p>`;
  const legend = `<div class="legend"><span><span class="sw" style="background:var(--accent)"></span>came from</span><span><span class="sw" style="background:var(--down)"></span>fed into</span></div>`;
  $("lineage").innerHTML = node && state
    ? `<h2>Lineage</h2><div class="ref">${esc(label(node))}</div>${legend}
       <h3>Came from, directly</h3>${list(state.inputs.get(node))}
       <h3>Fed into, directly</h3>${list(state.outputs.get(node))}
       <p class="meta">${up.size} upstream and ${down.size} downstream in all. "record" links are in the record itself; "design" links come from the design document, as declared.</p>`
    : `<h2>Lineage</h2><p class="meta">Select a card to see what it came from and what it fed. The plan is the last column.</p>${legend}`;
}

// A problem with something the reader opened: said once at the top, the view left as it was.
function flash(message) {
  const old = $("flash"); if (old) old.remove();
  $("summary").insertAdjacentHTML("afterbegin", `<span class="err" id="flash" role="alert">${message}</span>`);
}

function clearView(message) {
  state = null;
  $("cols").innerHTML = "";
  $("summary").innerHTML = message;
  select(null);
}

document.addEventListener("click", (ev) => {
  const go = ev.target.closest("[data-go]");
  if (go) {
    const node = go.dataset.go;
    select(node);
    const el = cardOf(node);
    if (el) { el.scrollIntoView({ block: "nearest", inline: "nearest" }); el.focus({ preventScroll: true }); }
    return;
  }
  const card = ev.target.closest("[data-node]");
  if (card) select(card.classList.contains("sel") ? null : card.dataset.node);
});

function show(record, design) { state = build(record, design || null); render(); }


// A folder: every record in it, each paired with its design by hash when the design is there too.
let deck = [], at = 0, deckNote = "", loadedDesign = null; // {doc, hash}, the design opened in the page
async function sha(data) {
  if (!(window.crypto && crypto.subtle)) return null;
  const bytes = typeof data === "string" ? new TextEncoder().encode(data) : data;
  const b = await crypto.subtle.digest("SHA-256", bytes);
  return "sha256:" + [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}
const isRecord = (j) => (j && Array.isArray(j.log)) || (Array.isArray(j) && j.some((i) => i && i.item === "design"));
// As the command reads them: an object with a policy and no log list.
const isDesign = (j) => j && typeof j === "object" && !Array.isArray(j) && !Array.isArray(j.log) && "policy" in j;
const designHash = (rec) => { const d = (Array.isArray(rec) ? rec : arr(obj(rec).log)).find((i) => i && i.item === "design"); return d && d.hash; };

async function openFolder(files) {
  const list = [...files].filter((f) => /\.(json|jsonl)$/i.test(f.name))
    .sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name));
  const recs = [], designs = new Map(), skipped = [], unhashed = [];
  for (const f of list) {
    const name = f.webkitRelativePath || f.name;
    const bytes = new Uint8Array(await f.arrayBuffer());
    const text = new TextDecoder().decode(bytes);
    const docs = [];
    if (/\.jsonl$/i.test(f.name)) {
      text.split("\n").forEach((line, i) => { if (!line.trim()) return; try { docs.push([name + " · line " + (i + 1), JSON.parse(line), line.trim()]); } catch (e) { skipped.push(name + " · line " + (i + 1)); } });
    } else {
      try { docs.push([name, JSON.parse(text), bytes]); } catch (e) { skipped.push(name); continue; }
    }
    for (const [n, j, raw] of docs) {
      if (isRecord(j)) recs.push({ name: n, record: j });
      else if (isDesign(j)) { const h = await sha(raw); if (h && !designs.has(h)) designs.set(h, j); else if (!h) unhashed.push(j); }
      else skipped.push(n);
    }
  }
  // Without crypto.subtle nothing pairs by hash; a lone design still serves, marked.
  if (!designs.size && unhashed.length === 1) designs.set("unhashed", unhashed[0]);
  deckFrom(recs, designs, skipped, list.length, unhashed.length ? "This browser cannot hash files here, so no design pairs by hash." : "");
}

function deckFrom(recs, designs, skipped, read, warning = "") {
  if (!recs.length) {
    const message = `No ommat records found in that folder (${esc(read)} JSON file${read === 1 ? "" : "s"} read). A record is a JSON object with a <code>log</code> list.`;
    if (state) flash(message);
    else { leaveDeck(); clearView(`<span class="err">${message}</span>`); }
    return;
  }
  const distinct = [...new Set(designs.values())];
  const only = distinct.length === 1 ? distinct[0] : null;
  deck = recs.map((r) => {
    const h = designHash(r.record);
    const exact = (str(h) && designs.get(h)) || (loadedDesign && str(h) && loadedDesign.hash === h ? loadedDesign.doc : null);
    if (exact) return { ...r, design: exact, guess: null };
    if (only) return { ...r, design: only, guess: "folder" };
    if (loadedDesign) return { ...r, design: loadedDesign.doc, guess: "loaded" };
    return { ...r, design: null, guess: null };
  });
  $("pick").innerHTML = deck.map((d, i) => `<option value="${i}">${esc(d.name)}</option>`).join("");
  deckNote = (skipped.length ? ` · ${skipped.length} file${skipped.length === 1 ? "" : "s"} skipped` : "") + (warning ? " · " + warning : "");
  $("deckNote").title = skipped.join("\n");
  $("pager").hidden = false;
  showAt(0);
}

const GUESSES = {
  folder: "No design here matches this record's design hash, so lineage uses the only design there is, which may differ.",
  loaded: "The design you opened does not match this record's design hash, so its lineage may differ.",
};

// One record shown on its own, with the design opened in the page, marked when the hashes differ.
function showOne(rec) {
  leaveDeck();
  show(rec, loadedDesign && loadedDesign.doc);
  const h = designHash(rec);
  if (loadedDesign && !(str(h) && loadedDesign.hash === h)) $("summary").insertAdjacentHTML("beforeend", `<div class="notice">${GUESSES.loaded}</div>`);
}

function showAt(i) {
  if (!deck.length) return;
  at = Math.max(0, Math.min(deck.length - 1, i));
  const d = deck[at];
  try { show(d.record, d.design); } catch (e) { clearView(`<span class="err">${esc(d.name)}: ${esc(e.message)}</span>`); }
  $("summary").insertAdjacentHTML("afterbegin", `<div class="kv"><span class="k">File</span><span class="v">${esc(d.name)}</span></div>`);
  if (d.guess && state) $("summary").insertAdjacentHTML("beforeend", `<div class="notice">${GUESSES[d.guess]}</div>`);
  $("deckNote").textContent = `${deck.filter((d) => d.design && !d.guess).length} of ${deck.length} paired with their design by hash` + deckNote;
  $("pick").value = String(at);
  $("count").textContent = `${at + 1} of ${deck.length}`;
  // A pager button about to be disabled hands focus to its pair, so the keyboard keeps its place.
  const focused = document.activeElement;
  $("prev").disabled = at === 0;
  $("next").disabled = at === deck.length - 1;
  if (focused && focused.disabled) (focused === $("prev") ? $("next") : $("prev")).focus();
}
function leaveDeck() { deck = []; $("pager").hidden = true; }

$("dirFile").addEventListener("change", () => { const files = $("dirFile").files; if (files && files.length) openFolder(files).catch((e) => flash(`Couldn't read that folder: ${esc(e.message)}`)); $("dirFile").value = ""; });
$("prev").addEventListener("click", () => showAt(at - 1));
$("next").addEventListener("click", () => showAt(at + 1));
$("pick").addEventListener("change", () => showAt(+$("pick").value));
document.addEventListener("keydown", (ev) => {
  const card = ev.target.closest && ev.target.closest("[data-node]");
  if (card && ev.target === card && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); if (!ev.repeat) card.click(); return; }
  if (deck.length < 2 || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  // Leave the arrows to anything that scrolls or takes text.
  if (ev.target.closest && ev.target.closest("input, textarea, select, .flow, .val, aside")) return;
  if (ev.key === "ArrowLeft") { ev.preventDefault(); showAt(at - 1); }
  else if (ev.key === "ArrowRight") { ev.preventDefault(); showAt(at + 1); }
});

// A file the reader opens: its bytes, their hash and its parsed JSON, or a message on failure.
async function readJson(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  return { json: JSON.parse(new TextDecoder().decode(bytes)), hash: await sha(bytes) };
}
const onFile = (input, cb) => input.addEventListener("change", () => {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  readJson(f).then(cb, (e) => flash(`Couldn't read ${esc(f.name)}: ${esc(e.message)}`));
});
onFile($("recFile"), ({ json }) => { try { build(json, null); } catch (e) { flash(esc(e.message)); return; } showOne(json); });
onFile($("desFile"), ({ json, hash }) => {
  if (!isDesign(json)) { flash("That file is not a design: a design has a policy and no log."); return; }
  loadedDesign = { doc: json, hash };
  try {
    if (deck.length) {
      // One rule whatever the order: an exact match, then the folder's only design, then this one.
      deck.forEach((d) => {
        if (d.design && !d.guess) return;
        if (hash && hash === designHash(d.record)) { d.design = json; d.guess = null; return; }
        if (d.guess === "folder") return;
        d.design = json;
        d.guess = "loaded";
      });
      showAt(at);
    } else if (state) showOne(state.record);
  } catch (e) { clearView(`<span class="err">${esc(e.message)}</span>`); }
});
$("pasteBtn").addEventListener("click", () => { $("pastePanel").hidden = !$("pastePanel").hidden; });
$("pasteGo").addEventListener("click", async () => {
  $("pasteErr").textContent = "";
  let rec, des = null;
  try {
    rec = JSON.parse($("pasteRec").value);
    const raw = $("pasteDes").value.trim();
    if (raw) {
      const doc = JSON.parse(raw);
      if (!isDesign(doc)) throw new Error("the design has no policy, or holds a log");
      des = { doc, hash: await sha(raw) };
    }
    build(rec, des && des.doc); // check it before anything on screen changes
  } catch (e) { $("pasteErr").textContent = "Couldn't read that: " + e.message; return; }
  if (des) loadedDesign = des;
  showOne(rec);
  $("pastePanel").hidden = true;
});

const DATA = JSON.parse($("lens-data").textContent);
if (DATA.records.length) deckFrom(DATA.records, new Map(Object.entries(DATA.designs)), DATA.skipped, DATA.read);
else clearView(`<span>No record yet. Open a record file, or a folder of records and their designs, with the buttons above.</span>`);
</script>
</body>
</html>
