<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ommat Lens</title>
<style>
/* The page loads nothing from the network: fonts are the system's, script and data inline. */
:root {
  --bg: #f3f5f7;
  --panel: #ffffff;
  --ink: #17212b;
  --muted: #5b6875;
  --line: #d6dde3;
  --accent: #1d6b8a;
  --accent-soft: #dcecf3;
  --down: #7a4fb0;
  --down-soft: #ece4f6;
  --good: #2f7d4f;
  --warn: #8a5608;
  --bad: #b23b3b;
  --bar: #7fa8bd;
  --display: "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171c; --panel: #182129; --ink: #e5ebf0; --muted: #94a3b0; --line: #2a3742;
    --accent: #5fb2d3; --accent-soft: #173445; --down: #b593e0; --down-soft: #2c2340;
    --good: #5fbf85; --warn: #e0a64a; --bad: #ec7b7b; --bar: #4f7d94; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171c; --panel: #182129; --ink: #e5ebf0; --muted: #94a3b0; --line: #2a3742;
  --accent: #5fb2d3; --accent-soft: #173445; --down: #b593e0; --down-soft: #2c2340;
  --good: #5fbf85; --warn: #e0a64a; --bad: #ec7b7b; --bar: #4f7d94; color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body); }
[hidden] { display: none !important; }
.wrap { padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font: 600 26px/1.1 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; max-width: 65ch; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
select, button, .file { font: 500 13px var(--body); color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
button:hover, .file:hover, select:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.file { position: relative; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.file:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.summary { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.kv { display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.k { font: 500 11px var(--display); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.v { font-family: var(--mono); font-size: 12.5px; overflow-wrap: anywhere; }
.chip { font: 600 11px var(--display); text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
.chip.good { color: var(--good); } .chip.bad { color: var(--bad); } .chip.warn { color: var(--warn); } .chip.info { color: var(--accent); }
.notice { color: var(--warn); font-size: 13px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }
.flow { overflow-x: auto; padding: 4px 4px 6px; }
.cols { display: flex; gap: 14px; align-items: flex-start; min-width: min-content; }
.col { width: 270px; flex: none; display: grid; gap: 8px; }
.cols.design .col { width: 210px; } /* five columns fit beside the lineage panel */
.colhead { font: 600 13px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; display: grid; gap: 6px; cursor: pointer; text-align: left; width: 100%; font: inherit; color: inherit; }
.card:hover { border-color: var(--accent); }
.card.call { border-style: dashed; }
.card.sel { outline: 2px solid var(--accent); outline-offset: 1px; box-shadow: inset 4px 0 0 var(--accent); }
.card.up { background: var(--accent-soft); border-color: var(--accent); }
.card.down { background: var(--down-soft); border-color: var(--down); }
.card.dim { opacity: .6; }
.ref { font: 500 12.5px var(--mono); overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.bars { display: grid; gap: 3px; }
.bar { display: grid; grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr) 3.4em; gap: 6px; align-items: center; font-size: 12px; }
.bar .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar .track { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--bar); }
.bar.top .fill { background: var(--accent); }
.bar.top .lab { font-weight: 600; }
.pct { font-variant-numeric: tabular-nums; text-align: right; font-family: var(--mono); font-size: 11.5px; }
.val { font: 12px var(--mono); background: var(--bg); border-radius: 4px; padding: 4px 6px; overflow-wrap: anywhere; max-height: 7.5em; overflow: auto; white-space: pre-wrap; }
.marker { font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
aside { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); max-height: calc(100vh - 32px); overflow: auto; }
aside h2 { font: 600 15px var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 0; }
aside h3 { font: 600 12px var(--display); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 6px 0 2px; }
aside ul { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 4px; }
aside li { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap; }
aside li button { background: none; border: none; padding: 0; color: var(--accent); font: 500 12.5px var(--mono); text-align: left; cursor: pointer; overflow-wrap: anywhere; }
.how { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; border: 1px solid var(--muted); }
textarea { width: 100%; min-height: 110px; font: 12px var(--mono); background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.paste { display: grid; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
.paste .row { display: flex; gap: 8px; flex-wrap: wrap; }
.err { color: var(--bad); font-size: 13px; }
.pager { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pager select { flex: 1 1 240px; min-width: 0; max-width: 100%; }
button:disabled { opacity: .4; cursor: default; }
@media (prefers-reduced-motion: no-preference) { .card { transition: background .15s, border-color .15s, opacity .15s; } }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; align-items: end; border-bottom: 1px solid var(--line); }
.tabs button { border-radius: 6px 6px 0 0; border-bottom: none; margin-bottom: -1px; }
.tabs button[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); border-bottom: 1px solid var(--accent-soft); }
.tabs .spacer { flex: 1; }
.tabs select { margin-bottom: 4px; max-width: 100%; }
.bar .track { position: relative; }
.tick { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.tg { color: var(--accent); }
.none { color: var(--muted); font-style: italic; }
.tbl-wrap { overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font: 600 11px var(--display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
tr.group td { font: 600 12px var(--display); letter-spacing: .04em; background: var(--bg); }
tr[data-row] { cursor: pointer; }
tr[data-row]:hover td { background: var(--accent-soft); }
td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.jump { font: 500 12px var(--body); padding: 4px 8px; }
/* Selection moves matches to the top of each column; Filter mode folds the rest into stubs. */
.colhead { order: -1; }
.card { content-visibility: auto; contain-intrinsic-size: auto 72px; }
.card.hide { display: none; }
.stub { order: 8; font: 500 12px var(--body); color: var(--muted); background: none; border: 1px dashed var(--line); border-radius: 8px; padding: 7px 10px; text-align: left; cursor: pointer; }
.stub:hover { border-color: var(--accent); color: var(--ink); }
/* Compact: the selected card in full; every other card keeps its value on one line, its bars,
   a call's outcome, the verdict and its boundary notes; direct links keep their meta. */
#cols.compact .card:not(.sel) .val { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-height: none; }
#cols.compact .card:not(.sel) .meta.labels { display: none; }
#cols.compact .card:not(.sel):not(.near) .meta:not(.notes) { display: none; }
/* Labels past the top few fold into one "Other" bar until the card is selected. */
.bar.extra { display: none; }
.card.sel .bar.extra { display: grid; }
.card.sel .bar.other { display: none; }
.bar.other .lab { font-style: italic; color: var(--muted); }
.bar.other .fill { opacity: .45; } /* several labels' mass, never read as one label's */
.card .qx { display: none; }
.card.sel .qx { display: inline; }
.card.sel .qmore { display: none; }
.qmore { font-style: italic; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>ommat Lens</h1>
      <p class="sub">A design and the turns it ran: what each target, question and rule is linked to, each turn's answers as percentages against the bars that pick them, and the turns side by side. Select any card to trace its lineage.</p>
    </div>
    <div class="controls">
      <label class="file" for="recFile">Open record…<input id="recFile" type="file" accept=".json,application/json"></label>
      <label class="file" for="dirFile">Open folder…<input id="dirFile" type="file" webkitdirectory multiple></label>
      <label class="file" for="desFile">Open design…<input id="desFile" type="file" accept=".json,application/json"></label>
      <button id="pasteBtn" type="button">Paste JSON</button>
    </div>
  </header>

  <div class="paste" id="pastePanel" hidden>
    <label class="k" for="pasteRec">Record document (the record's <code>document</code> bytes, or its <code>log</code>)</label>
    <textarea id="pasteRec" spellcheck="false" placeholder='{"hash": "sha256:…", "log": [ … ], "unhashed": { … }}'></textarea>
    <label class="k" for="pasteDes">Design document, optional (the loaded design's <code>document</code>)</label>
    <textarea id="pasteDes" spellcheck="false" placeholder='{"format": 6, "sources": { … }, "rules": { … }, "policy": { … }}'></textarea>
    <div class="row"><button id="pasteGo" type="button">Show this record</button><span class="err" id="pasteErr"></span></div>
  </div>

  <nav class="tabs" id="tabs" aria-label="Views">
    <button type="button" data-tab="design">Design</button>
    <button type="button" data-tab="turn" aria-current="page">Turn</button>
    <button type="button" data-tab="turns">Turns</button>
    <span class="spacer"></span>
    <select id="viewMode" aria-label="When a card is selected" title="What a selection does to the cards it does not reach"><option value="filter">Selection filters the rest</option><option value="dim">Selection dims the rest</option></select>
    <select id="density" aria-label="Card density"><option value="auto">Density: auto</option><option value="full">Density: full</option><option value="compact">Density: compact</option></select>
    <select id="designPick" aria-label="Design shown" hidden></select>
    <select id="turnsBy" aria-label="Group turns by" hidden></select>
  </nav>

  <nav class="pager" id="pager" aria-label="Records" hidden>
    <button id="prev" type="button">‹ Previous</button>
    <select id="pick" aria-label="Record in this folder"></select>
    <span class="v" id="count"></span>
    <button id="next" type="button">Next ›</button>
    <span class="meta" id="deckNote"></span>
  </nav>

  <div class="summary" id="summary"></div>
  <div class="main" id="mainView">
    <div class="flow"><div class="cols" id="cols"></div></div>
    <aside id="lineage" aria-label="Lineage" aria-live="polite"></aside>
  </div>
  <div class="tbl-wrap" id="turnsView" hidden></div>
</div>

<script id="lens-data" type="application/json">__OMMAT_LENS_DATA__</script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
// Any value to escaped text: a hostile record's object or array shows as JSON, never throws.
const text = (s) => { if (typeof s === "string") return s; try { return typeof s === "object" && s !== null ? JSON.stringify(s) : String(s); } catch (e) { return "?"; } };
const esc = (s) => text(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (p) => (typeof p === "number" ? (p * 100).toFixed(p * 100 >= 99.95 || p * 100 < 0.05 ? 0 : 1) + "%" : "–");
const arr = (x) => (Array.isArray(x) ? x : []);
const obj = (x) => (x && typeof x === "object" && !Array.isArray(x) ? x : {});
// A component's declared reads: a function's reads, a table's inputs' reads.
const readsOf = (c) => (obj(c).form === "table" ? arr(obj(c).inputs).map((i) => obj(i).read) : obj(c).reads);
const str = (x) => typeof x === "string";

// A ref's declared base: prefix and name, without a grounded bracket or a field path.
function parseRef(ref) {
  const m = /^([qtd]):([^.[\]]+)/.exec(str(ref) ? ref : "");
  if (!m) return { base: ref, candidate: null };
  let rest = ref.slice(m[0].length), candidate = null;
  if (rest.startsWith("[")) {
    // The bracket holds a JSON string; read it with a JSON parser, not by searching for ].
    let i = 1;
    for (; i < rest.length; i++) { if (rest[i] === "\\") { i++; continue; } if (rest[i] === '"' && i > 1) break; }
    try { candidate = JSON.parse(rest.slice(1, i + 1)); } catch (e) { candidate = rest.slice(1, i + 1); }
  }
  return { base: m[1] + ":" + m[2], candidate };
}

let state = null; // the Turn view's graph, from one record
let dstate = null; // the Design view's graph, from one design document
let tab = "turn", selected = null, designKey = null, turnsBy = "";
let designTurn = null; // the record whose design designKey last followed
let mode = "filter", density = "auto"; // what a selection does to the rest, and card density
const openCols = new Set(); // the columns whose folded cards the reader opened
const TOP_LABELS = 2; // labels shown before the rest fold into "Other": the leader and runner-up
const known = new Map(); // every design the page holds: key (its hash, or "opened") -> {doc, name}
const addKnown = (key, doc) => { if (!known.has(key) || key === "opened") known.set(key, { doc, name: `${text(obj(doc).name ?? "unnamed")} · ${key.startsWith("sha256:") ? key.slice(7, 15) + "…" : key}` }); };
const keyOf = (doc) => { for (const [k, v] of known) if (v.doc === doc) return k; addKnown("opened", doc); return "opened"; };

function build(record, design) {
  const log = Array.isArray(record) ? record : obj(record).log;
  if (!Array.isArray(log)) throw new Error("The record has no log: give the record document or its log.");
  design = design ? obj(design) : null;
  const items = log.map((it, idx) => [idx, it]).filter(([, it]) => it && typeof it === "object" && str(it.item));
  const unhashed = obj(!Array.isArray(record) && record.unhashed);
  const settings = obj((items.find(([, i]) => i.item === "settings") || [])[1]);
  const providers = obj(settings.providers);
  const grounded = obj(settings.grounded);
  const entries = new Map(), calls = new Map(), rounds = new Map();
  let plan = null, verdict = null;
  const col = (n) => { const k = Number.isInteger(n) ? n : "?"; if (!rounds.has(k)) rounds.set(k, { calls: [], entries: [] }); return rounds.get(k); };
  for (const [idx, it] of items) {
    if (it.item === "entry" && str(it.ref) && !entries.has(it.ref)) { entries.set(it.ref, { ...it, idx }); col(it.round).entries.push(it.ref); }
    else if (it.item === "call") { calls.set(idx, { ...it, idx }); col(it.round).calls.push(idx); }
    else if (it.item === "plan") plan = { ...it, idx };
    else if (it.item === "verdict") verdict = it;
  }
  const byBase = new Map();
  for (const r of entries.keys()) { const b = parseRef(r).base; if (!byBase.has(b)) byBase.set(b, []); byBase.get(b).push(r); }

  // Node ids: "e:<ref>" for an entry, "c:<index>" for a call, "plan".
  const inputs = new Map(); // node -> Map(from -> {node, how, src})
  const add = (node, from, how, src) => {
    if (!from || from === node) return;
    if (!inputs.has(node)) inputs.set(node, new Map());
    if (!inputs.get(node).has(from)) inputs.get(node).set(from, { node: from, how, src });
  };
  // A ref read, as the nodes holding it: its entry, or each grounded entry of a declared ref.
  const nodesOf = (ref) => {
    if (!str(ref)) return [];
    if (entries.has(ref)) return ["e:" + ref];
    const { base, candidate } = parseRef(ref);
    // A grounded ref with a field path reads its own candidate's entry.
    if (str(candidate) && entries.has(base + "[" + JSON.stringify(candidate) + "]")) return ["e:" + base + "[" + JSON.stringify(candidate) + "]"];
    if (entries.has(base)) return ["e:" + base];
    return (byBase.get(base) || []).map((r) => "e:" + r);
  };
  const link = (node, refs, how, src) => { for (const r of arr(refs)) for (const n of nodesOf(r)) add(node, n, how, src); };
  const sources = obj(design && design.sources), rules = obj(design && design.rules);
  const sourceInputs = (sid) => {
    const s = obj(sources[sid]);
    const refs = [...arr(s.needs)];
    for (const q of Object.values(obj(s.provides))) {
      const qq = obj(q);
      for (const slot of arr(obj(qq.wording).slots)) if (str(obj(obj(slot).origin).ref)) refs.push(slot.origin.ref);
      if (str(obj(qq.text).ref)) refs.push(qq.text.ref);
      if (str(obj(qq.reference_date).ref)) refs.push(qq.reference_date.ref);
      if (qq.labels && typeof qq.labels === "object" && !Array.isArray(qq.labels) && str(qq.labels.candidates)) refs.push(qq.labels.candidates);
    }
    if (str(s.grounded)) refs.push(s.grounded);
    return refs;
  };
  for (const [ref, e] of entries) {
    const node = "e:" + ref;
    const { base } = parseRef(ref);
    if (calls.has(e.call)) add(node, "c:" + e.call, "asked in this call", "record");
    if (Object.hasOwn(grounded, base) && str(grounded[base])) link(node, [grounded[base]], "its candidate set", "record");
    for (const d of arr(e.derivation)) link(node, obj(d).refs, "helper " + obj(d).helper, "record");
    link(node, obj(obj(e.marker).cause).refs, "named in its marker's cause", "record");
    const provider = Object.hasOwn(providers, base) ? providers[base] : undefined;
    if (ref.startsWith("d:") && str(provider) && Object.hasOwn(rules, provider)) link(node, readsOf(rules[provider]), "rule " + provider + " reads it", "design");
  }
  for (const [idx, c] of calls) {
    link("c:" + idx, obj(obj(c.outcome).failed).refs, "named in its failure", "record");
    for (const sid of arr(c.sources)) {
      if (!str(sid) || !Object.hasOwn(sources, sid)) continue;
      link("c:" + idx, sourceInputs(sid), "source " + sid + " needs it", "design");
      link("c:" + idx, [obj(obj(sources[sid]).requirement).ref], "source " + sid + " is gated on it", "design");
    }
  }
  if (plan) {
    for (const d of arr(plan.derivation)) link("plan", obj(d).refs, "helper " + obj(d).helper, "record");
    link("plan", obj(plan.cause).refs, "named in the plan's cause", "record");
    for (const step of arr(plan.steps)) {
      for (const o of Object.values(obj(obj(step).arguments))) link("plan", [obj(o).ref], "a step's argument", "record");
      for (const q of arr(obj(step).requirements)) link("plan", [obj(q).ref], "a step's requirement", "record");
    }
    for (const c of arr(obj(plan.context).entries)) link("plan", [obj(c).ref], "a context entry", "record");
    for (const f of arr(obj(verdict).failures)) link("plan", [obj(f).ref, obj(obj(f).requirement).ref], "the guard refused on it", "record");
    if (design) link("plan", readsOf(design.policy), "the policy reads it", "design");
    for (const c of arr(obj(design && design.context).entries)) {
      link("plan", [obj(c).ref], "a context entry", "design");
      link("plan", arr(obj(obj(c).text).slots).map((sl) => obj(obj(sl).origin).ref), "a context entry's wording", "design");
    }
  }
  const outputs = new Map();
  for (const [node, ins] of inputs) for (const i of ins.values()) {
    if (!outputs.has(i.node)) outputs.set(i.node, []);
    outputs.get(i.node).push({ node, how: i.how, src: i.src });
  }
  const flat = new Map([...inputs].map(([k, v]) => [k, [...v.values()]]));
  const label = (node) => node === "plan" ? "plan" : node.startsWith("c:") ? "call · " + arr(obj(calls.get(+node.slice(2))).sources).join(", ") : node.slice(2);
  return { kind: "turn", log, unhashed, settings, providers, grounded, entries, calls, plan, verdict, rounds, inputs: flat, outputs, design, record, byBase, label };
}

// A design document alone, as a graph of declared links. Node ids: "e:<ref>" for a ref a source or
// rule provides and for t:state, "g:<id>" a target, "p:<path>" a parameter, "req:<n>" a plan-level
// requirement, "plan" the policy. An "e:" or "plan" id is the Turn view's id for the same thing.
function buildDesign(doc) {
  const design = obj(doc);
  const sources = obj(design.sources), rules = obj(design.rules), policy = obj(design.policy);
  const params = obj(design.parameters), targets = obj(design.targets);
  const nodes = new Map([["e:t:state", { kind: "state" }]]);
  for (const [sid, s] of Object.entries(sources)) for (const [ref, q] of Object.entries(obj(obj(s).provides))) nodes.set("e:" + ref, { kind: ref.startsWith("q:") ? "question" : "tool", sid, q: obj(q) });
  for (const [rid, r] of Object.entries(rules)) if (str(obj(r).provides)) nodes.set("e:" + r.provides, { kind: "rule", rid, r: obj(r) });
  for (const [id, tg] of Object.entries(targets)) nodes.set("g:" + id, { kind: "target", id, t: obj(tg) });
  for (const [path, p] of Object.entries(params)) nodes.set("p:" + path, { kind: "param", path, p: obj(p) });
  arr(design.requirements).forEach((q, i) => nodes.set("req:" + i, { kind: "req", q: obj(q) }));
  nodes.set("plan", { kind: "policy" });

  const inputs = new Map();
  const add = (node, from, how) => {
    if (!from || from === node || !nodes.has(from)) return;
    if (!inputs.has(node)) inputs.set(node, new Map());
    if (!inputs.get(node).has(from)) inputs.get(node).set(from, { node: from, how, src: "design" });
  };
  const nodeOf = (ref) => (str(ref) ? "e:" + parseRef(ref).base : null);
  const link = (node, refs, how) => { for (const r of arr(refs)) add(node, nodeOf(r), how); };
  const linkParams = (node, paths, how) => { for (const p of arr(paths)) if (str(p)) add(node, "p:" + p, how); };
  const boundaryPaths = (field) => Object.values(obj(field)).flatMap((e) => Array.isArray(e) ? e
    : [...["bar", "thresholds", "margin", "null", "confidence", "value"].flatMap((k) => arr(obj(e)[k])), ...arr(obj(e).mass).flatMap((m) => arr(obj(m).bounds))]);
  for (const [sid, s0] of Object.entries(sources)) {
    const s = obj(s0);
    for (const [ref, q0] of Object.entries(obj(s.provides))) {
      const node = "e:" + ref, q = obj(q0);
      link(node, s.needs, "source " + sid + " needs it");
      for (const slot of arr(obj(q.wording).slots)) {
        const o = obj(obj(slot).origin);
        if (str(o.ref)) link(node, [o.ref], "a slot of its wording");
        if (str(o.param)) linkParams(node, [o.param], "a slot of its wording");
      }
      link(node, [obj(q.text).ref, obj(q.reference_date).ref], "the text it reads");
      if (str(s.grounded)) link(node, [s.grounded], "its candidate set");
      if (q.labels && typeof q.labels === "object" && !Array.isArray(q.labels)) link(node, [q.labels.candidates], "its candidate-valued labels");
      link(node, [obj(s.requirement).ref], "source " + sid + " is gated on it");
    }
  }
  for (const [rid, r0] of Object.entries(rules)) {
    const r = obj(r0);
    if (!str(r.provides)) continue;
    const node = "e:" + r.provides;
    link(node, readsOf(r), "rule " + rid + " reads it");
    linkParams(node, r.params, "rule " + rid + " reads it");
    linkParams(node, boundaryPaths(r.boundaries), "a declared boundary");
    if (str(r.grounded)) link(node, [r.grounded], "its candidate set");
  }
  link("plan", readsOf(policy), "the policy reads it");
  linkParams("plan", policy.params, "the policy reads it");
  linkParams("plan", boundaryPaths(policy.boundaries), "a declared boundary");
  arr(design.requirements).forEach((q, i) => { link("req:" + i, [obj(q).ref], "it names this ref"); add("plan", "req:" + i, "guards every execute plan"); });
  for (const c of arr(obj(design.context).entries)) {
    link("plan", [obj(c).ref], "a context entry");
    for (const slot of arr(obj(obj(c).text).slots)) {
      const o = obj(obj(slot).origin);
      if (str(o.ref)) link("plan", [o.ref], "a context entry's wording");
      if (str(o.param)) linkParams("plan", [o.param], "a context entry's wording");
    }
  }

  const outputs = new Map();
  for (const [node, ins] of inputs) for (const i of ins.values()) {
    if (!outputs.has(i.node)) outputs.set(i.node, []);
    outputs.get(i.node).push({ node, how: i.how, src: "design" });
  }
  const label = (node) => node === "plan" ? "policy" : node.startsWith("g:") ? node.slice(2) : node.startsWith("p:") ? "parameter " + node.slice(2)
    : node.startsWith("req:") ? "requirement " + text(obj(obj(nodes.get(node)).q).ref) : node.slice(2);
  return { kind: "design", design, nodes, inputs: new Map([...inputs].map(([k, v]) => [k, [...v.values()]])), outputs, label, links: targetLinks(design) };
}

// Per target id, the declared links: the questions asking about it, those bearing on it with a
// role, and the rules estimating it. A missing link is undeclared, never "unrelated".
function targetLinks(design) {
  const asks = new Map(), bears = new Map(), est = new Map();
  const push = (m, k, v) => { if (!m.has(k)) m.set(k, []); m.get(k).push(v); };
  for (const s of Object.values(obj(obj(design).sources))) for (const [ref, q] of Object.entries(obj(obj(s).provides))) {
    if (!ref.startsWith("q:")) continue;
    if (str(obj(q).target)) push(asks, q.target, ref);
    for (const l of arr(obj(q).latent_targets)) if (str(obj(l).target)) push(bears, l.target, { ref, role: obj(l).role });
  }
  for (const r of Object.values(obj(obj(design).rules))) if (str(obj(r).target) && str(obj(r).provides)) push(est, r.target, r.provides);
  return { asks, bears, est };
}

// The targets a design declares for one declared ref: a question's own and latent ones, a rule's
// own; null for a ref that takes none (the state, a tool result) or that the design lacks.
function targetsOf(design, base) {
  for (const s of Object.values(obj(obj(design).sources))) {
    const provides = obj(obj(s).provides);
    if (!Object.hasOwn(provides, base)) continue;
    if (!base.startsWith("q:")) return null;
    const q = obj(provides[base]);
    return { rule: false, target: str(q.target) ? q.target : null, latent: arr(q.latent_targets).map(obj) };
  }
  for (const r of Object.values(obj(obj(design).rules))) if (obj(r).provides === base) return { rule: true, target: str(r.target) ? r.target : null, latent: [] };
  return null;
}

function targetHtml(t) {
  if (!t) return "";
  if (!t.target && !t.latent.length) return `<span class="none">no target declared</span>`;
  return [t.target ? `<span class="tg">${t.rule ? "estimates" : "asks"} ${esc(t.target)}</span>` : "",
    ...t.latent.map((l) => `<span class="tg">bears on ${esc(l.target)} (${esc(l.role)})</span>`)].join("");
}

// The values a design's boundaries fields name for one read, by role, each [path, value], a plain
// read's also with the key it bounds, field path included; a path two components name is shown
// once. Null when no field names the read.
function boundsOf(design, base) {
  const params = obj(obj(design).parameters);
  const out = { bar: [], thresholds: [], margin: [], null: [], confidence: [], value: [], plain: [], mass: [] };
  const seen = new Set();
  const put = (role, p, key) => { if (str(p) && !seen.has(role + " " + key + " " + p)) { seen.add(role + " " + key + " " + p); out[role].push([p, Object.hasOwn(params, p) ? obj(params[p]).value : undefined, key]); } };
  let any = false;
  const fields = [...Object.values(obj(obj(design).rules)).map((r) => obj(r).boundaries), obj(obj(design).policy).boundaries];
  for (const f of fields) for (const [key, entry] of Object.entries(obj(f))) {
    if (parseRef(key).base !== base) continue;
    any = true;
    if (Array.isArray(entry)) { for (const p of entry) put("plain", p, key); continue; }
    for (const role of ["bar", "thresholds", "margin", "null", "confidence", "value"]) for (const p of arr(obj(entry)[role])) put(role, p, key);
    for (const m of arr(obj(entry).mass)) out.mass.push({ labels: arr(obj(m).labels), bounds: arr(obj(m).bounds).map((p) => [p, Object.hasOwn(params, p) ? obj(params[p]).value : undefined]) });
  }
  return any ? out : null;
}
const num = (x) => typeof x === "number" && Number.isFinite(x);

// A difference or sum of probabilities without float noise: 0.6 - 0.4 is 0.2.
const exact = (x) => Number(x.toPrecision(12));
// A percentage, with three decimals when it lies within rounding of a bound it is judged against.
const pctNear = (x, bounds) => (bounds.some((b) => num(b) && Math.abs(x - b) < 0.0005) ? (x * 100).toFixed(3) + "%" : pct(x));
// A probability as a percentage; any other bound, a count or an age, as the number it is.
const amount = (x) => (num(x) ? String(x) : x === undefined ? "–" : JSON.stringify(x) ?? "–");

function reach(map, start) {
  const seen = new Set(), stack = [start];
  while (stack.length) for (const x of map.get(stack.pop()) || []) if (!seen.has(x.node)) { seen.add(x.node); stack.push(x.node); }
  seen.delete(start); // a cycle leads back to it
  return seen;
}

// With a paired design, an entry's value then the boundaries its design declares for it, by role:
// ticks on each bar for a bar or threshold, and the lead, mass, none and confidence against theirs.
function valueHtml(e, b, paired) {
  const held = valueOnly(e, b);
  if (!paired) return held;
  const v = e.value;
  const asked = v && typeof v === "object" && (v.probabilities || v.kind === "extraction");
  if (!b) return held + (asked ? `<div class="meta"><span class="none">no boundaries declared</span></div>` : "");
  const notes = [];
  const named = (pairs, word, shown = pct) => pairs.forEach(([p, x]) => notes.push(`<span title="${esc(p)} = ${esc(amount(x))}">${word} ${esc(num(x) ? shown(x) : amount(x))}</span> <span title="${esc(p)}">(${esc(p)})</span>`));
  if (v && typeof v === "object" && v.probabilities && typeof v.probabilities === "object") {
    const ps = Object.values(v.probabilities).filter(num).sort((x, y) => y - x);
    const lead = ps.length ? exact(ps[0] - (ps[1] ?? 0)) : null; // a lone label leads by its own p
    if (lead !== null) notes.push(`<span title="${esc(lead)}">lead ${pctNear(lead, b.margin.map(([, x]) => x))}</span>`);
    named(b.margin, "margin");
    named(b.bar, "bar");
    for (const m of b.mass) {
      const mass = Math.min(1, exact(m.labels.reduce((s, l) => s + (num(v.probabilities[l]) ? v.probabilities[l] : 0), 0)));
      m.bounds.forEach(([p, x]) => notes.push(`mass ${esc(m.labels.join("+"))} <span title="${esc(mass)}">${pctNear(mass, [x])}</span> vs ${num(x) ? pct(x) : esc(JSON.stringify(x ?? null))} <span title="${esc(p)}">(${esc(p)})</span>`));
    }
    if (b.thresholds.length) notes.push(`thresholds ticked per label (${b.thresholds.map(([p]) => esc(p)).join(", ")})`);
  } else {
    named(b.null, "none bar");
    named(b.confidence, "confidence bar");
    named(b.value, "value bound", amount);
  }
  for (const [p, x, key] of b.plain) notes.push(`${esc(key)} compared with ${esc(amount(x))} <span title="${esc(p)}">(${esc(p)})</span>`);
  return held + (notes.length ? `<div class="meta notes">${notes.map((n) => `<span>${n}</span>`).join("")}</div>` : "");
}

// A long list of items as its first few, the rest folded behind "+n more" until the card is
// selected; each item is already escaped HTML.
function foldList(items, keep, sep = "") {
  if (items.length <= keep + 1) return items.join(sep);
  return items.slice(0, keep).join(sep) + items.slice(keep).map((x) => `<span class="qx">${sep}${x}</span>`).join("") + `<span class="qmore">${sep}+${items.length - keep} more</span>`;
}

// The labels to fold into "Other": none for a short list, else every label past the top few by
// probability, except one a threshold or a mass bound names, which always shows. A bar ticks every
// label alike, so it exempts none.
function foldedLabels(labels, probs, bounded) {
  if (labels.length <= TOP_LABELS + 1) return new Set();
  const shown = new Set([...labels].sort((a, c) => (num(probs[c]) ? probs[c] : -1) - (num(probs[a]) ? probs[a] : -1)).slice(0, TOP_LABELS));
  return new Set(labels.filter((l) => !shown.has(l) && !bounded(l)));
}

function valueOnly(e, b) {
  if (e.marker) {
    const m = obj(e.marker), c = obj(m.cause);
    const tone = m.kind === "Unavailable" ? "bad" : "warn";
    return `<div class="marker"><span class="chip ${tone}">${esc(m.kind ?? "marker")}</span><span class="v">${esc(c.code ?? "")}</span>${arr(c.refs).length ? `<span class="meta">${arr(c.refs).map(esc).join(", ")}</span>` : ""}</div>`;
  }
  const v = e.value;
  if (v === undefined) return `<div class="val">–</div>`;
  if (v && typeof v === "object" && v.probabilities && typeof v.probabilities === "object") {
    const probs = v.probabilities;
    const labels = arr(v.labels).length ? arr(v.labels) : Object.keys(probs);
    const top = labels.reduce((a, b) => ((probs[b] ?? -1) > (probs[a] ?? -1) ? b : a), labels[0]);
    const ticks = (l) => (b ? [...b.bar.map(([p, x]) => [x, p]), ...b.thresholds.map(([p, x]) => [num(x) ? x : obj(x)[l], p])].filter(([x]) => num(x)) : []);
    const bound = (l) => !!b && (b.thresholds.some(([, x]) => num(x) || num(obj(x)[l])) || b.mass.some((m) => m.labels.includes(l)));
    const folded = foldedLabels(labels, probs, bound);
    const barHtml = (l, p, extra, other) => {
      const w = typeof p === "number" ? Math.max(0, Math.min(100, p * 100)) : 0;
      const marks = other ? "" : ticks(l).map(([x, path]) => `<span class="tick" style="left:calc(${Math.max(0, Math.min(100, x * 100))}% - 1px)" title="${esc(path)} = ${esc(x)}"></span>`).join("");
      return `<div class="bar${l === top && !other ? " top" : ""}${extra ? " extra" : ""}${other ? " other" : ""}${!other && bound(l) ? " bound" : ""}"><span class="lab" title="${esc(l)}">${esc(l)}</span><span class="track"><span class="fill" style="display:block;width:${w}%"></span>${marks}</span><span class="pct" title="${esc(amount(p))}">${pct(p)}</span></div>`;
    };
    const rest = folded.size ? barHtml(`+${folded.size} label${folded.size === 1 ? "" : "s"}`, exact([...folded].reduce((s, l) => s + (num(probs[l]) ? probs[l] : 0), 0)), false, true) : "";
    return `<div class="bars">${labels.map((l) => barHtml(l, probs[l], folded.has(l), false)).join("")}${rest}</div>`;
  }
  if (v && typeof v === "object" && v.kind === "extraction") {
    const shown = v.value === null ? "none found" : v.value === undefined ? "–" : JSON.stringify(v.value);
    return `<div class="val">${esc(shown)}</div><div class="meta notes"><span>confidence ${pct(v.confidence)}</span><span>none: ${pct(v.p_null)}</span>${v.guess != null ? `<span>guess ${esc(JSON.stringify(v.guess))}</span>` : ""}</div>`;
  }
  return `<div class="val">${esc(JSON.stringify(v, null, 1))}</div>`;
}

const failureText = (f) => { const x = obj(f); return "step " + (x.step ?? "?") + (str(x.ref) ? " · " + x.ref : ""); };

function render() {
  const s = state;
  const design = obj((s.log.find((i) => obj(i).item === "design")));
  const plan = s.plan, verdict = s.verdict ? obj(s.verdict) : null;
  const vtone = !verdict || !str(verdict.kind) ? "warn" : verdict.kind === "passed" ? "good" : "bad";
  const designName = s.design && s.design.name;
  const hash = (h) => (str(h) ? esc(h.slice(0, 19)) + "…" : "–");
  $("summary").innerHTML = [
    designName ? `<div class="kv"><span class="k">Design</span><span class="v">${esc(designName)}</span></div>` : "",
    `<div class="kv"><span class="k">Design hash</span><span class="v">${hash(design.hash)}</span></div>`,
    s.record && str(s.record.hash) ? `<div class="kv"><span class="k">Record</span><span class="v">${hash(s.record.hash)}</span></div>` : "",
    `<div class="kv"><span class="k">Format</span><span class="v">${esc(design.format ?? "?")}</span></div>`,
    plan ? `<div class="kv"><span class="k">Plan</span><span class="chip info">${esc(plan.kind ?? "?")}</span></div>` : "",
    `<div class="kv"><span class="k">Verdict</span><span class="chip ${vtone}">${esc(verdict ? verdict.kind ?? "?" : "none")}</span></div>`,
    plan && (plan.reason || plan.reply) ? `<div class="kv"><span class="k">${plan.reason ? "Reason" : "Reply"}</span><span>${esc(plan.reason || plan.reply)}</span></div>` : "",
    s.design ? "" : `<div class="notice">No design loaded: lineage shows only what the record holds. Open the design to see what each rule and source read.</div>`,
  ].join("");

  const order = [...s.rounds.keys()].sort((a, b) => (a === "?") - (b === "?") || a - b);
  let html = "";
  for (const n of order) {
    const r = s.rounds.get(n);
    html += `<section class="col"><div class="colhead"><span>${n === "?" ? "No round" : "Round " + esc(n)}</span><span>${r.entries.length} entr${r.entries.length === 1 ? "y" : "ies"}</span></div>`;
    for (const idx of r.calls) {
      const c = s.calls.get(idx);
      const un = obj(obj(s.unhashed.calls)[idx]);
      const failed = obj(c.outcome).failed;
      html += `<div role="button" tabindex="0" aria-pressed="false" class="card call" data-node="c:${idx}"><span class="k">Call · ${esc(arr(c.sources).join(", "))}</span>
        <span class="meta notes">${failed ? `<span class="chip bad">failed ${esc(obj(failed).code ?? "")}</span>` : `<span>returned</span>`}${c.provider ? `<span>${esc(c.provider)}</span>` : ""}${c.model_reported || c.model_requested ? `<span>${esc(c.model_reported || c.model_requested)}</span>` : ""}${typeof un.latency === "number" ? `<span>${un.latency.toFixed(2)} s</span>` : ""}${c.precision != null ? `<span>precision ${esc(JSON.stringify(c.precision))}</span>` : ""}</span>
        <span class="meta">${foldList(Object.entries(obj(c.questions)).map(([r, q]) => `<span title="question identity ${esc(obj(q).identity ?? "none")}">${esc(r)}${str(obj(q).identity) ? " · " + esc(q.identity.slice(7, 15)) + "…" : ""}</span>`), 4)}</span></div>`;
    }
    for (const ref of r.entries) {
      const e = s.entries.get(ref);
      const { base, candidate } = parseRef(ref);
      const who = (Object.hasOwn(s.providers, base) && s.providers[base]) || (ref === "t:state" ? "the state" : "");
      html += `<div role="button" tabindex="0" aria-pressed="false" class="card" data-node="e:${esc(ref)}"><span class="ref">${esc(ref)}</span>
        <span class="meta">${who ? `<span>from ${esc(who)}</span>` : ""}${candidate != null ? `<span>candidate ${esc(candidate)}</span>` : ""}${s.design ? targetHtml(targetsOf(s.design, base)) : ""}</span>${valueHtml(e, s.design ? boundsOf(s.design, base) : null, !!s.design)}</div>`;
    }
    html += `</section>`;
  }
  if (plan) {
    const steps = arr(plan.steps).map((st, i) => `<div class="val">${i + 1}. ${esc(obj(st).tool ?? "?")} ${esc(JSON.stringify(obj(st).arguments ?? {}))}</div>`).join("");
    const fails = verdict && arr(verdict.failures).length ? `<div class="meta notes">${arr(verdict.failures).map((f) => esc(failureText(f))).join(" · ")}</div>` : "";
    html += `<section class="col"><div class="colhead"><span>Decision</span><span></span></div>
      <div role="button" tabindex="0" aria-pressed="false" class="card" data-node="plan"><span class="ref">plan · ${esc(plan.kind ?? "?")}</span>
      ${plan.reason ? `<span>${esc(plan.reason)}</span>` : ""}${plan.reply ? `<span>${esc(plan.reply)}</span>` : ""}
      ${plan.cause ? `<div class="marker"><span class="chip warn">cause</span><span class="v">${esc(obj(plan.cause).code ?? "")}</span></div>` : ""}${steps}
      <span class="meta notes"><span class="chip ${vtone}">${esc(verdict ? verdict.kind ?? "?" : "no verdict")}</span></span>${fails}</div></section>`;
  }
  $("cols").classList.toggle("design", false);
  $("cols").innerHTML = html;
  select(null);
}

// The Design view: one design document's targets, sources, rules, policy and parameters.
function renderDesign() {
  const g = dstate;
  const d = g.design;
  const key = designKey && known.has(designKey) ? designKey : null;
  const count = (k) => [...g.nodes.values()].filter((n) => n.kind === k).length;
  $("summary").innerHTML = [
    `<div class="kv"><span class="k">Design</span><span class="v">${esc(d.name ?? "unnamed")}</span></div>`,
    key && key.startsWith("sha256:") ? `<div class="kv"><span class="k">Design hash</span><span class="v">${esc(key.slice(0, 19))}…</span></div>` : "",
    `<div class="kv"><span class="k">Format</span><span class="v">${esc(d.format ?? "?")}</span></div>`,
    `<div class="kv"><span class="k">Targets</span><span class="v">${count("target")}</span></div>`,
    `<div class="kv"><span class="k">Questions</span><span class="v">${count("question")}</span></div>`,
    `<div class="kv"><span class="k">Rules</span><span class="v">${count("rule")}</span></div>`,
    `<div class="kv"><span class="k">Policy</span><span class="v">${esc(obj(d.policy).form ?? "?")}</span></div>`,
    state && state.guess && key && known.get(key).doc === state.design ? `<div class="notice">${GUESSES[state.guess]}</div>` : "",
  ].join("");
  const card = (node, body) => `<div role="button" tabindex="0" aria-pressed="false" class="card" data-node="${esc(node)}">${body}</div>`;
  const column = (title, cards) => `<section class="col"><div class="colhead"><span>${title}</span><span>${cards.length}</span></div>${cards.join("") || `<p class="meta">None declared</p>`}</section>`;
  const of = (k) => [...g.nodes].filter(([, n]) => n.kind === k);
  const links = g.links;
  const targets = of("target").map(([node, n]) => card(node, `<span class="ref">${esc(n.id)}</span><span>${esc(n.t.statement ?? "")}</span>
    ${n.t.values != null ? `<span class="meta">values: ${esc(n.t.values)}</span>` : ""}
    <span class="meta"><span>asked by ${(links.asks.get(n.id) || []).length}</span><span>borne on by ${new Set((links.bears.get(n.id) || []).map((x) => x.ref)).size}</span><span>estimated by ${(links.est.get(n.id) || []).length}</span></span>`));
  const asked = [card("e:t:state", `<span class="ref">t:state</span><span class="meta"><span>the input state</span></span>${d.state != null ? `<div class="val">${esc(d.state)}</div>` : ""}`),
    ...[...g.nodes].filter(([, n]) => n.kind === "question" || n.kind === "tool").map(([node, n]) => {
      const s = obj(obj(d.sources)[n.sid]);
      const ref = node.slice(2);
      const head = `<span class="ref">${esc(ref)}</span><span class="meta"><span>source ${esc(n.sid)}</span>${n.kind === "question" ? `<span>${esc(n.q.kind ?? "?")}</span>` : `<span>tool result</span>`}${s.when ? `<span>when: ${esc(obj(s.when).form ?? "declared")}</span>` : ""}${s.requirement ? `<span>gated on ${esc(obj(s.requirement).ref)}</span>` : ""}${str(s.grounded) ? `<span>over ${esc(s.grounded)}</span>` : ""}</span>`;
      if (n.kind === "tool") return card(node, head);
      const lab = (l) => (str(l) ? l : obj(l).name);
      const cv = n.q.labels && typeof n.q.labels === "object" && !Array.isArray(n.q.labels) ? n.q.labels : null;
      const labels = Array.isArray(n.q.labels) ? n.q.labels.map(lab).filter(str)
        : cv ? [...arr(cv.fixed).map(lab).filter(str), `(the candidates of ${text(cv.candidates ?? "?")}${num(cv.at) ? " after label " + cv.at : ""})`] : [];
      return card(node, `${head}${str(obj(n.q.wording).template) ? `<div class="val">${esc(n.q.wording.template)}</div>` : ""}
        ${labels.length ? `<span class="meta labels"><span>${foldList(labels.map(esc), 6, " · ")}</span></span>` : ""}<span class="meta">${targetHtml(targetsOf(d, ref))}</span>`);
    })];
  const ruleCards = of("rule").map(([node, n]) => card(node, `<span class="ref">${esc(node.slice(2))}</span>
    <span class="meta"><span>rule ${esc(n.rid)}</span><span>${esc(n.r.form ?? "?")}</span>${n.r.outputs != null ? `<span>${esc(n.r.outputs)}</span>` : ""}</span>
    <span class="meta">reads ${arr(readsOf(n.r)).map(esc).join(", ") || "nothing"}</span>
    <span class="meta">${targetHtml(targetsOf(d, node.slice(2)))}${n.r.boundaries ? `<span>boundaries declared</span>` : `<span class="none">no boundaries declared</span>`}</span>`));
  const policy = obj(d.policy);
  const decide = [card("plan", `<span class="ref">policy · ${esc(policy.form ?? "?")}</span><span class="meta">reads ${arr(readsOf(policy)).map(esc).join(", ") || "nothing"}</span>
      ${policy.boundaries ? `<span class="meta">boundaries declared</span>` : ""}<span class="meta">plans: ${Object.keys(obj(d.plans)).map(esc).join(", ") || "none declared"}</span>`),
    ...of("req").map(([node, n]) => card(node, `<span class="ref">requires ${esc(n.q.ref)}</span><span class="meta">= ${esc(JSON.stringify(n.q.value ?? null))} · every execute plan</span>`))];
  const paramCards = of("param").map(([node, n]) => card(node, `<span class="ref">${esc(n.path)}</span><span class="meta">${esc(n.p.type ?? "")}</span><div class="val">${esc(JSON.stringify(n.p.value ?? null))}</div>`));
  $("cols").classList.toggle("design", true);
  $("cols").innerHTML = column("Targets", targets) + column("State and sources", asked) + column("Rules", ruleCards) + column("Policy", decide) + column("Parameters", paramCards);
}

const graph = () => (tab === "design" ? dstate : state);
const label = (node) => graph().label(node);
const cardOf = (node) => [...$("cols").querySelectorAll("[data-node]")].find((el) => el.dataset.node === node);

// Each card's place under a selection: 0 the selection, then its direct links, then the rest of
// its lineage, each kind together; a node absent from the map is not linked to it.
function rankOf(g, node, tlinks, up, down) {
  const rank = new Map();
  if (!node) return rank;
  const put = (n, r) => { if (!rank.has(n)) rank.set(n, r); };
  put(node, 0);
  if (tlinks) {
    tlinks.asks.forEach((r) => put("e:" + r, 1));
    tlinks.bears.forEach((x) => put("e:" + x.ref, 2));
    tlinks.est.forEach((r) => put("e:" + r, 3));
  } else {
    // A question's or rule's own targets are declared links too, though no read joins them.
    const t = g.kind === "design" && node.startsWith("e:") ? targetsOf(g.design, node.slice(2)) : null;
    if (t && t.target) put("g:" + t.target, 1);
    if (t) t.latent.forEach((l) => put("g:" + text(l.target), 2));
    (g.inputs.get(node) || []).forEach((i) => put(i.node, 1));
    (g.outputs.get(node) || []).forEach((i) => put(i.node, 2));
    up.forEach((n) => put(n, 3));
  }
  down.forEach((n) => put(n, 4));
  return rank;
}

// What a stub says it folded: under a target, the cards declaring no target at all apart from
// those declaring others, so a missing link never reads as "unrelated".
function stubText(g, node, folded, open) {
  const verb = open ? "Hide" : "Show";
  const onTarget = g.kind === "design" && node.startsWith("g:");
  const targets = folded.filter((n) => n.startsWith("g:")).length, rest = folded.filter((n) => !n.startsWith("g:"));
  const parts = targets ? [onTarget ? `${targets} other target${targets === 1 ? "" : "s"}` : `${targets} target${targets === 1 ? "" : "s"} it declares no link to`] : [];
  if (rest.length && onTarget) {
    const none = rest.filter((n) => { if (!n.startsWith("e:")) return false; const t = targetsOf(g.design, n.slice(2)); return t && !t.target && !t.latent.length; }).length;
    if (rest.length - none) parts.push(`${rest.length - none} with no link declared to ${node.slice(2)}`);
    if (none) parts.push(`${none} declaring no target link`);
  } else if (rest.length) parts.push(`${rest.length} ${g.kind === "design" ? "with no declared link to it" : "not on its lineage"}`);
  return parts.length > 1 ? `${verb} ${folded.length}: ${parts.join(", ")}` : `${verb} ${parts[0]}`;
}

// A target's selection lights its declared links and all that follows them; any other card lights
// what it came from and what it fed. Each column's matches come first, and in Filter mode the rest
// fold into the column's stub.
function select(node) {
  const g = graph();
  if (!g || (g.kind === "design" && node && !g.nodes.has(node))) node = null;
  if (node !== selected) openCols.clear();
  selected = node;
  let up = new Set(), down = new Set(), tlinks = null;
  if (node && g.kind === "design" && node.startsWith("g:")) {
    const id = node.slice(2), L = g.links;
    tlinks = { asks: L.asks.get(id) || [], bears: L.bears.get(id) || [], est: L.est.get(id) || [] };
    up = new Set([...tlinks.asks, ...tlinks.bears.map((x) => x.ref), ...tlinks.est].map((r) => "e:" + r));
    for (const n of up) for (const x of reach(g.outputs, n)) if (!up.has(x)) down.add(x);
  } else if (node) {
    up = reach(g.inputs, node);
    down = reach(g.outputs, node);
  }
  const rank = rankOf(g, node, tlinks, up, down);
  let hidden = 0;
  const active = document.activeElement, refocus = active && active.dataset ? active.dataset.openCol : undefined;
  [...$("cols").querySelectorAll("section.col")].forEach((col, i) => {
    for (const old of col.querySelectorAll(".stub")) old.remove();
    const folded = [];
    for (const el of col.querySelectorAll("[data-node]")) {
      const n = el.dataset.node, r = rank.get(n);
      el.classList.toggle("sel", n === node);
      el.setAttribute("aria-pressed", String(n === node));
      el.classList.toggle("up", up.has(n));
      el.classList.toggle("down", down.has(n));
      el.classList.toggle("near", r === 1 || r === 2 || (!!tlinks && r === 3));
      el.classList.toggle("dim", !!node && r === undefined);
      el.style.order = node ? String(r ?? 9) : "";
      const fold = !!node && r === undefined && mode === "filter";
      el.classList.toggle("hide", fold && !openCols.has(i));
      if (fold) folded.push(n);
    }
    if (folded.length) {
      hidden += openCols.has(i) ? 0 : folded.length;
      // Open, the stub stands between the matches and the cards it let out, so it can close them.
      col.insertAdjacentHTML("beforeend", `<button type="button" class="stub" data-open-col="${i}" aria-expanded="${openCols.has(i)}"${openCols.has(i) ? "" : ' style="order:1000"'}>${esc(stubText(g, node, folded, openCols.has(i)))}</button>`);
      if (refocus === String(i)) col.querySelector(".stub").focus();
    }
  });
  applyDensity();
  const go = (n, how) => `<li><button type="button" data-go="${esc(n)}">${esc(label(n))}</button>${how ? `<span class="how">${esc(how)}</span>` : ""}</li>`;
  const list = (items) => items && items.length ? `<ul>${items.map((i) => go(i.node, i.how + " · " + i.src)).join("")}</ul>` : `<p class="meta">${g && g.kind === "design" ? "None declared" : "None"}</p>`;
  // A target link names a target the design may not declare; only a declared one is a card.
  const goTarget = (id, how) => (g.nodes.has("g:" + id) ? go("g:" + id, how) : `<li><span class="v">${esc(id)}</span><span class="how">${esc(how)} · not declared in targets</span></li>`);
  const refs = (rs, how) => rs.length ? `<ul>${rs.map((r) => go("e:" + r, how)).join("")}</ul>` : `<p class="meta">None declared</p>`;
  const dimWord = g && g.kind === "design" ? "no link declared" : "not on its lineage";
  const dimmed = node && (mode === "dim" || openCols.size) ? `<span><span class="sw" style="background:var(--line)"></span>dimmed: ${dimWord}</span>` : "";
  const legend = `<div class="legend"><span><span class="sw" style="background:var(--accent)"></span>${tlinks ? "linked" : "came from"}</span><span><span class="sw" style="background:var(--down)"></span>fed into</span>${dimmed}</div>`;
  let jump = "";
  if (node && g.kind === "turn" && g.design && (node === "plan" || node.startsWith("e:"))) jump = `<button type="button" class="jump" data-jump="design">Open in Design</button>`;
  if (node && g.kind === "design" && state && turnNode(node)) jump = `<button type="button" class="jump" data-jump="turn">Show in this turn</button>`;
  const asked = node && g.kind === "turn" && node.startsWith("e:q:") ? identityOf(g, node.slice(2)) : null;
  if (asked && deck.length > 1) jump += `${jump ? " " : ""}<button type="button" class="jump" data-compare="${esc(asked)}">Compare across turns</button>`;
  let body;
  if (!node) body = `<p class="meta">Select a card to see what it came from and what it fed.${g && g.kind === "design" ? " Select a target to see every question and rule declared against it." : " The plan is the last column."}</p>`;
  else if (tlinks) {
    const all = [...g.nodes.values()];
    const untargeted = all.filter((n) => n.kind === "question" && !str(n.q.target) && !arr(n.q.latent_targets).length).length
      + all.filter((n) => n.kind === "rule" && !str(n.r.target)).length;
    body = `<h3>Asked about by</h3>${refs(tlinks.asks, "asks about it")}
      <h3>Borne on by</h3>${tlinks.bears.length ? `<ul>${tlinks.bears.map((x) => go("e:" + x.ref, x.role)).join("")}</ul>` : `<p class="meta">None declared</p>`}
      <h3>Estimated by</h3>${refs(tlinks.est, "a rule estimates it")}
      <p class="meta">${down.size} downstream through declared reads. Links are only those declared: ${untargeted} of this design's questions and rules declare no target link, which says nothing about whether they bear on it.</p>`;
  } else {
    const t = g.kind === "design" && node.startsWith("e:") ? targetsOf(g.design, node.slice(2)) : null;
    body = `${t ? `<h3>Targets</h3>${t.target || t.latent.length ? `<ul>${t.target ? goTarget(t.target, t.rule ? "estimates" : "asks about") : ""}${t.latent.map((l) => goTarget(text(l.target), "bears on · " + text(l.role))).join("")}</ul>` : `<p class="meta">None declared</p>`}` : ""}
      <h3>Came from, directly</h3>${list(g.inputs.get(node))}
      <h3>Fed into, directly</h3>${list(g.outputs.get(node))}
      <p class="meta">${up.size} upstream and ${down.size} downstream in all. "record" links are in the record itself; "design" links come from the design document, as declared.</p>`;
  }
  const filtered = hidden ? `<p class="notice">Filtered: ${hidden} card${hidden === 1 ? "" : "s"} folded into the columns' stubs.</p>` : "";
  $("lineage").innerHTML = `<h2>Lineage</h2>${node ? `<div class="ref">${esc(label(node))}</div>` : ""}${legend}${filtered}${jump}${body}`;
}

// The question identity a turn's call recorded for one of its entries, or null.
function identityOf(g, ref) {
  const e = g.entries.get(ref), q = obj(obj(g.calls.get(e && e.call)).questions);
  const id = obj(q[ref] ?? q[parseRef(ref).base]).identity;
  return str(id) ? id : null;
}

// Compact when asked, or by default once a column holds more than 40 cards.
function applyDensity() {
  const most = Math.max(0, ...[...$("cols").querySelectorAll("section.col")].map((c) => c.querySelectorAll("[data-node]").length));
  const compact = density === "compact" || (density === "auto" && most > 40);
  $("cols").classList.toggle("compact", compact);
  const auto = $("density").options && $("density").options[0];
  if (auto) auto.text = "Density: auto" + (density === "auto" ? (compact ? " (compact)" : " (full)") : "");
}

// The same thing's node in the other view: a turn's grounded entry is its declared ref's card in
// the design, and a declared ref is its first grounded entry in the turn.
function designNode(node) {
  if (node === "plan") return "plan";
  if (!str(node) || !node.startsWith("e:")) return null;
  return "e:" + parseRef(node.slice(2)).base; // showDesign drops one its design lacks
}
function turnNode(node) {
  if (!state) return null;
  if (node === "plan") return state.plan ? "plan" : null;
  if (!str(node) || !node.startsWith("e:")) return null;
  const ref = node.slice(2);
  if (state.entries.has(ref)) return node;
  const first = (state.byBase.get(ref) || [])[0];
  return first ? "e:" + first : null;
}

// A problem with something the reader opened: said once at the top, the view left as it was.
function flash(message) {
  const old = $("flash"); if (old) old.remove();
  $("summary").insertAdjacentHTML("afterbegin", `<span class="err" id="flash" role="alert">${message}</span>`);
}

function clearView(message) {
  state = null;
  $("cols").innerHTML = "";
  $("summary").innerHTML = message;
  select(null);
}

// The tab bar, the pager and the two layouts, shown for the current tab.
function chrome() {
  for (const b of $("tabs").querySelectorAll("[data-tab]")) { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); }
  $("pager").hidden = !(tab === "turn" && deck.length);
  $("mainView").hidden = tab === "turns";
  $("turnsView").hidden = tab !== "turns";
  $("turnsBy").hidden = tab !== "turns";
  $("designPick").hidden = !(tab === "design" && known.size > 1);
  $("viewMode").hidden = $("density").hidden = tab === "turns";
}

function setTab(next, node = null) {
  tab = next;
  openCols.clear(); // column indices belong to the view they were opened in
  chrome();
  if (tab === "design") showDesign(node);
  else if (tab === "turns") renderTurns();
  else if (deck.length) { showAt(at); if (node) select(node); }
  else if (state) { render(); if (node) select(node); }
  else clearView(`<span>No record yet. Open a record file, or a folder of records and their designs, with the buttons above.</span>`);
}

// The design shown: the one picked, else the current turn's, else the first the page holds.
function showDesign(node) {
  const k = (designKey && known.has(designKey) && designKey) || (state && state.design && keyOf(state.design)) || (known.size ? known.keys().next().value : null);
  if (!k) {
    dstate = null;
    $("cols").innerHTML = "";
    $("summary").innerHTML = `<span>No design yet. Open a design document (the loaded design's <code>document</code>), or a folder holding one.</span>`;
    select(null);
    return;
  }
  designKey = k;
  $("designPick").innerHTML = [...known].map(([key, v]) => `<option value="${esc(key)}">${esc(v.name)}</option>`).join("");
  $("designPick").value = k;
  dstate = buildDesign(known.get(k).doc);
  renderDesign();
  select(node && dstate.nodes.has(node) ? node : null);
}

// The Turns view: every record a row, grouped by design hash, or for one question identity every
// answer to it with what read it.
function renderTurns() {
  const rows = deck.map((d, i) => { let g = null; try { g = build(d.record, d.design); } catch (e) { /* listed as unreadable */ } return { i, d, g, hash: designHash(d.record) }; });
  const ids = new Map();
  for (const r of rows) if (r.g) for (const c of r.g.calls.values()) for (const [ref, q] of Object.entries(obj(c.questions))) {
    const id = obj(q).identity;
    if (!str(id)) continue;
    if (!ids.has(id)) ids.set(id, { refs: new Set(), turns: new Set() });
    ids.get(id).refs.add(ref);
    ids.get(id).turns.add(r.i);
  }
  $("turnsBy").innerHTML = [`<option value="">Group by design hash</option>`,
    ...[...ids].map(([id, x]) => `<option value="${esc(id)}" title="${esc(id)}">Question ${esc([...x.refs].join(", "))} (${x.turns.size} turn${x.turns.size === 1 ? "" : "s"})</option>`)].join("");
  if (!ids.has(turnsBy)) turnsBy = "";
  $("turnsBy").value = turnsBy;
  const designs = new Set(rows.map((r) => r.hash).filter(str));
  $("summary").innerHTML = `<div class="kv"><span class="k">Turns</span><span class="v">${rows.length}</span></div><div class="kv"><span class="k">Design hashes</span><span class="v">${designs.size}</span></div><div class="kv"><span class="k">Question identities</span><span class="v">${ids.size}</span></div>`;
  if (!rows.length) { $("turnsView").innerHTML = `<p class="meta" style="padding:12px">${state ? "The Turns view lists a folder's records; this record was opened on its own." : "No records yet."} Open a folder of records to compare turns.</p>`; return; }
  const short = (h) => (str(h) ? esc(h.slice(0, 19)) + "…" : "no design hash");
  const markOf = (e) => `${esc(obj(e.marker).kind ?? "marker")} ${esc(obj(obj(e.marker).cause).code ?? "")}`;
  let html;
  if (!turnsBy) {
    const groups = new Map();
    for (const r of rows) { const k = str(r.hash) ? r.hash : ""; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
    html = `<table><thead><tr><th>File</th><th>Plan</th><th>Verdict</th><th>Rounds</th><th>Failed calls</th><th>Markers by cause</th><th>Reason or reply</th></tr></thead><tbody>`;
    for (const [k, rs] of groups) {
      const name = known.has(k) ? esc(known.get(k).name) : "design not loaded";
      html += `<tr class="group"><td colspan="7">${short(k)} · ${name} · ${rs.length} turn${rs.length === 1 ? "" : "s"}</td></tr>`;
      for (const r of rs) {
        if (!r.g) { html += `<tr data-row="${r.i}"><td>${esc(r.d.name)}</td><td colspan="6" class="err">unreadable record</td></tr>`; continue; }
        const g = r.g, marks = new Map();
        for (const e of g.entries.values()) if (e.marker) { const m = markOf(e); marks.set(m, (marks.get(m) || 0) + 1); }
        const failed = [...g.calls.values()].filter((c) => obj(c.outcome).failed).length;
        const rounds = [...g.rounds.keys()].filter((n) => Number.isInteger(n) && n > 0).length;
        html += `<tr data-row="${r.i}"><td>${esc(r.d.name)}</td><td>${esc(obj(g.plan).kind ?? "none")}</td><td>${esc(obj(g.verdict).kind ?? "none")}</td>
          <td class="num">${rounds}</td><td class="num">${failed}</td><td>${[...marks].map(([m, n]) => `${m}${n > 1 ? " ×" + n : ""}`).join("<br>") || "–"}</td><td>${esc(obj(g.plan).reason || obj(g.plan).reply || "")}</td></tr>`;
      }
    }
  } else {
    html = `<table><thead><tr><th>File</th><th>Ref</th><th>Leading, or value</th><th>p, or confidence</th><th>Runner-up, or none</th><th>Lead</th><th>Read by (derivation)</th></tr></thead><tbody>`;
    for (const r of rows) {
      if (!r.g || !ids.get(turnsBy).turns.has(r.i)) continue;
      for (const [ref, e] of r.g.entries) {
        // The answer's own call names its identity: one turn may ask another question at this ref.
        if (identityOf(r.g, ref) !== turnsBy) continue;
        const named = [ref, parseRef(ref).base]; // a per-candidate pick names the declared ref
        const readers = [...r.g.entries].filter(([dr, de]) => dr.startsWith("d:") && arr(de.derivation).some((x) => arr(obj(x).refs).some((n) => named.includes(n))))
          .map(([dr, de]) => `${esc(dr)} = ${de.marker ? markOf(de) : esc(JSON.stringify(de.value) ?? "–")}`).join("<br>") || "–";
        let cells;
        const v = e.value;
        if (e.marker) cells = `<td colspan="4">${markOf(e)}</td>`;
        else if (v && typeof v === "object" && v.probabilities && typeof v.probabilities === "object") {
          const ranked = Object.entries(v.probabilities).filter(([, p]) => num(p)).sort((a, b) => b[1] - a[1]);
          const [a, b] = [ranked[0] || ["–", null], ranked[1] || ["–", null]];
          const lead = a[1] == null ? "–" : pct(exact(a[1] - (b[1] ?? 0))); // a lone label leads by its own p
          cells = `<td>${esc(a[0])}</td><td class="num">${pct(a[1])}</td><td>${esc(b[0])} ${b[1] != null ? pct(b[1]) : ""}</td><td class="num">${lead}</td>`;
        } else if (v && typeof v === "object" && v.kind === "extraction") {
          cells = `<td>${esc(v.value === null ? "none found" : JSON.stringify(v.value))}</td><td class="num">${pct(v.confidence)}</td><td>none ${pct(v.p_null)}</td><td>–</td>`;
        } else cells = `<td colspan="4">${esc(JSON.stringify(v) ?? "–")}</td>`;
        html += `<tr data-row="${r.i}" data-at="e:${esc(ref)}"><td>${esc(r.d.name)}</td><td>${esc(ref)}</td>${cells}<td>${readers}</td></tr>`;
      }
    }
  }
  $("turnsView").innerHTML = html + `</tbody></table>`;
}

document.addEventListener("click", (ev) => {
  const tabBtn = ev.target.closest("[data-tab]");
  if (tabBtn) {
    // The Design tab follows the turn on show, unless the reader picked a design since it changed.
    if (tabBtn.dataset.tab === "design" && state && state.design && state.record !== designTurn) { designKey = keyOf(state.design); designTurn = state.record; }
    setTab(tabBtn.dataset.tab, tab === "turn" && tabBtn.dataset.tab === "design" ? designNode(selected) : tab === "design" && tabBtn.dataset.tab === "turn" ? turnNode(selected) : null);
    return;
  }
  const jump = ev.target.closest("[data-jump]");
  if (jump) {
    if (jump.dataset.jump === "design") { const node = designNode(selected); designKey = keyOf(state.design); designTurn = state.record; setTab("design", node); }
    else setTab("turn", turnNode(selected));
    return;
  }
  const compare = ev.target.closest("[data-compare]");
  if (compare) { turnsBy = compare.dataset.compare; setTab("turns"); return; }
  const stub = ev.target.closest("[data-open-col]");
  if (stub) {
    const i = +stub.dataset.openCol;
    if (openCols.has(i)) openCols.delete(i); else openCols.add(i);
    select(selected);
    return;
  }
  const row = ev.target.closest("[data-row]");
  if (row) { at = +row.dataset.row; setTab("turn", row.dataset.at || null); return; }
  const go = ev.target.closest("[data-go]");
  if (go) {
    const node = go.dataset.go;
    select(node);
    const el = cardOf(node);
    if (el) { el.scrollIntoView({ block: "nearest", inline: "nearest" }); el.focus({ preventScroll: true }); }
    return;
  }
  const card = ev.target.closest("[data-node]");
  if (card) select(card.classList.contains("sel") ? null : card.dataset.node);
});

function show(record, design) { state = build(record, design || null); render(); }


// A folder: every record in it, each paired with its design by hash when the design is there too.
let deck = [], at = 0, deckNote = "", loadedDesign = null; // {doc, hash}, the design opened in the page
async function sha(data) {
  if (!(window.crypto && crypto.subtle)) return null;
  const bytes = typeof data === "string" ? new TextEncoder().encode(data) : data;
  const b = await crypto.subtle.digest("SHA-256", bytes);
  return "sha256:" + [...new Uint8Array(b)].map((x) => x.toString(16).padStart(2, "0")).join("");
}
const isRecord = (j) => (j && Array.isArray(j.log)) || (Array.isArray(j) && j.some((i) => i && i.item === "design"));
// As the command reads them: an object with a policy and no log list.
const isDesign = (j) => j && typeof j === "object" && !Array.isArray(j) && !Array.isArray(j.log) && "policy" in j;
const designHash = (rec) => { const d = (Array.isArray(rec) ? rec : arr(obj(rec).log)).find((i) => i && i.item === "design"); return d && d.hash; };

async function openFolder(files) {
  const list = [...files].filter((f) => /\.(json|jsonl)$/i.test(f.name))
    .sort((a, b) => (a.webkitRelativePath || a.name).localeCompare(b.webkitRelativePath || b.name));
  const recs = [], designs = new Map(), skipped = [], unhashed = [];
  for (const f of list) {
    const name = f.webkitRelativePath || f.name;
    const bytes = new Uint8Array(await f.arrayBuffer());
    const text = new TextDecoder().decode(bytes);
    const docs = [];
    if (/\.jsonl$/i.test(f.name)) {
      text.split("\n").forEach((line, i) => { if (!line.trim()) return; try { docs.push([name + " · line " + (i + 1), JSON.parse(line), line.trim()]); } catch (e) { skipped.push(name + " · line " + (i + 1)); } });
    } else {
      try { docs.push([name, JSON.parse(text), bytes]); } catch (e) { skipped.push(name); continue; }
    }
    for (const [n, j, raw] of docs) {
      if (isRecord(j)) recs.push({ name: n, record: j });
      else if (isDesign(j)) { const h = await sha(raw); if (h && !designs.has(h)) designs.set(h, j); else if (!h) unhashed.push(j); }
      else skipped.push(n);
    }
  }
  // Without crypto.subtle nothing pairs by hash; a lone design still serves, marked.
  if (!designs.size && unhashed.length === 1) designs.set("unhashed", unhashed[0]);
  deckFrom(recs, designs, skipped, list.length, unhashed.length ? "This browser cannot hash files here, so no design pairs by hash." : "");
}

function deckFrom(recs, designs, skipped, read, warning = "") {
  if (!recs.length && designs.size) { // a folder of designs alone opens on the Design view
    for (const [k, doc] of designs) addKnown(k, doc);
    designKey = [...designs.keys()][0];
    designTurn = state ? state.record : null;
    setTab("design");
    return;
  }
  if (!recs.length) {
    const message = `No ommat records found in that folder (${esc(read)} JSON file${read === 1 ? "" : "s"} read). A record is a JSON object with a <code>log</code> list.`;
    if (state || dstate || tab !== "turn") flash(message);
    else { leaveDeck(); clearView(`<span class="err">${message}</span>`); }
    return;
  }
  // One object per design: a design the page already holds keeps its object, so keyOf finds it.
  for (const [k, doc] of [...designs]) { addKnown(k, doc); if (known.has(k)) designs.set(k, known.get(k).doc); }
  const distinct = [...new Set(designs.values())];
  const only = distinct.length === 1 ? distinct[0] : null;
  deck = recs.map((r) => {
    const h = designHash(r.record);
    const exact = (str(h) && designs.get(h)) || (loadedDesign && str(h) && loadedDesign.hash === h ? loadedDesign.doc : null);
    if (exact) return { ...r, design: exact, guess: null };
    if (only) return { ...r, design: only, guess: "folder" };
    if (loadedDesign) return { ...r, design: loadedDesign.doc, guess: "loaded" };
    return { ...r, design: null, guess: null };
  });
  $("pick").innerHTML = deck.map((d, i) => `<option value="${i}">${esc(d.name)}</option>`).join("");
  deckNote = (skipped.length ? ` · ${skipped.length} file${skipped.length === 1 ? "" : "s"} skipped` : "") + (warning ? " · " + warning : "");
  $("deckNote").title = skipped.join("\n");
  at = 0;
  turnsBy = "";
  setTab("turn");
}

const GUESSES = {
  folder: "No design here matches this record's design hash, so lineage uses the only design there is, which may differ.",
  loaded: "The design you opened does not match this record's design hash, so its lineage may differ.",
};

// One record shown on its own, with the design opened in the page, marked when the hashes differ.
function showOne(rec) {
  leaveDeck();
  tab = "turn";
  chrome();
  show(rec, loadedDesign && loadedDesign.doc);
  const h = designHash(rec);
  if (loadedDesign && !(str(h) && loadedDesign.hash === h)) { state.guess = "loaded"; $("summary").insertAdjacentHTML("beforeend", `<div class="notice">${GUESSES.loaded}</div>`); }
}

function showAt(i) {
  if (!deck.length) return;
  at = Math.max(0, Math.min(deck.length - 1, i));
  const d = deck[at];
  try { show(d.record, d.design); state.guess = d.guess; } catch (e) { clearView(`<span class="err">${esc(d.name)}: ${esc(e.message)}</span>`); }
  $("summary").insertAdjacentHTML("afterbegin", `<div class="kv"><span class="k">File</span><span class="v">${esc(d.name)}</span></div>`);
  if (d.guess && state) $("summary").insertAdjacentHTML("beforeend", `<div class="notice">${GUESSES[d.guess]}</div>`);
  $("deckNote").textContent = `${deck.filter((d) => d.design && !d.guess).length} of ${deck.length} paired with their design by hash` + deckNote;
  $("pick").value = String(at);
  $("count").textContent = `${at + 1} of ${deck.length}`;
  // A pager button about to be disabled hands focus to its pair, so the keyboard keeps its place.
  const focused = document.activeElement;
  $("prev").disabled = at === 0;
  $("next").disabled = at === deck.length - 1;
  if (focused && focused.disabled) (focused === $("prev") ? $("next") : $("prev")).focus();
}
function leaveDeck() { deck = []; $("pager").hidden = true; }

$("dirFile").addEventListener("change", () => { const files = $("dirFile").files; if (files && files.length) openFolder(files).catch((e) => flash(`Couldn't read that folder: ${esc(e.message)}`)); $("dirFile").value = ""; });
$("prev").addEventListener("click", () => showAt(at - 1));
$("next").addEventListener("click", () => showAt(at + 1));
$("pick").addEventListener("change", () => showAt(+$("pick").value));
document.addEventListener("keydown", (ev) => {
  const card = ev.target.closest && ev.target.closest("[data-node]");
  if (card && ev.target === card && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); if (!ev.repeat) card.click(); return; }
  if (tab !== "turn" || deck.length < 2 || ev.altKey || ev.ctrlKey || ev.metaKey) return;
  // Leave the arrows to anything that scrolls or takes text.
  if (ev.target.closest && ev.target.closest("input, textarea, select, .flow, .val, aside")) return;
  if (ev.key === "ArrowLeft") { ev.preventDefault(); showAt(at - 1); }
  else if (ev.key === "ArrowRight") { ev.preventDefault(); showAt(at + 1); }
});

// A file the reader opens: its bytes, their hash and its parsed JSON, or a message on failure.
async function readJson(file) {
  const bytes = new Uint8Array(await file.arrayBuffer());
  return { json: JSON.parse(new TextDecoder().decode(bytes)), hash: await sha(bytes) };
}
const onFile = (input, cb) => input.addEventListener("change", () => {
  const f = input.files && input.files[0];
  input.value = "";
  if (!f) return;
  readJson(f).then(cb, (e) => flash(`Couldn't read ${esc(f.name)}: ${esc(e.message)}`));
});
onFile($("recFile"), ({ json }) => { try { build(json, null); } catch (e) { flash(esc(e.message)); return; } showOne(json); });
onFile($("desFile"), ({ json: read, hash }) => {
  if (!isDesign(read)) { flash("That file is not a design: a design has a policy and no log."); return; }
  const json = hash && known.has(hash) ? known.get(hash).doc : read; // one object per design, so keyOf finds it
  loadedDesign = { doc: json, hash };
  designTurn = null; // the turn's design may have changed: the Design tab follows it again
  addKnown(hash || "opened", json);
  try {
    // One rule whatever the order: an exact match, then the folder's only design, then this one.
    deck.forEach((d) => {
      if (d.design && !d.guess) return;
      if (hash && hash === designHash(d.record)) { d.design = json; d.guess = null; return; }
      if (d.guess === "folder") return;
      d.design = json;
      d.guess = "loaded";
    });
    if (tab === "design" || (!deck.length && !state)) { designKey = hash || "opened"; designTurn = state ? state.record : null; setTab("design"); }
    else if (tab === "turns") setTab("turns");
    else if (deck.length) showAt(at);
    else if (state) showOne(state.record);
  } catch (e) { clearView(`<span class="err">${esc(e.message)}</span>`); }
});
$("pasteBtn").addEventListener("click", () => { $("pastePanel").hidden = !$("pastePanel").hidden; });
$("pasteGo").addEventListener("click", async () => {
  $("pasteErr").textContent = "";
  let rec, des = null;
  try {
    rec = JSON.parse($("pasteRec").value);
    const raw = $("pasteDes").value.trim();
    if (raw) {
      const doc = JSON.parse(raw);
      if (!isDesign(doc)) throw new Error("the design has no policy, or holds a log");
      const hash = await sha(raw);
      des = { doc: hash && known.has(hash) ? known.get(hash).doc : doc, hash };
    }
    build(rec, des && des.doc); // check it before anything on screen changes
  } catch (e) { $("pasteErr").textContent = "Couldn't read that: " + e.message; return; }
  if (des) { loadedDesign = des; addKnown(des.hash || "opened", des.doc); }
  showOne(rec);
  $("pastePanel").hidden = true;
});

const DATA = JSON.parse($("lens-data").textContent);
$("designPick").addEventListener("change", () => { designKey = $("designPick").value; setTab("design"); });
$("turnsBy").addEventListener("change", () => { turnsBy = $("turnsBy").value; renderTurns(); });
$("viewMode").addEventListener("change", () => { mode = $("viewMode").value; select(selected); });
$("density").addEventListener("change", () => { density = $("density").value; applyDensity(); });
if (DATA.records.length) deckFrom(DATA.records, new Map(Object.entries(DATA.designs)), DATA.skipped, DATA.read);
else if (Object.keys(DATA.designs).length) { for (const [k, doc] of Object.entries(DATA.designs)) addKnown(k, doc); setTab("design"); }
else clearView(`<span>No record yet. Open a record file, or a folder of records and their designs, with the buttons above.</span>`);
</script>
</body>
</html>
