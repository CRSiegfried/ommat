<html lang="en">
<head>

<title>ommat lens</title>
<style>
/* Loads nothing from the network: system fonts, inline script and data. Palette: dataviz reference instance. */
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.14); --wash: rgba(11,11,11,0.04);
  --r-read: #2a78d6; --r-helper: #e87ba4; --r-req: #7048c8; --req-wash: rgba(112,72,200,0.08); /* the source requirement: 5.9:1 on the surface */
  --good: #0ca30c; --warning: #fab219; --critical: #d03b3b; --neutral: #898781;
  --ring-warning: #b77a00; /* a darker amber step for rings: 3.53:1 on the light surface */
  --fade: .28; --fade-read: .28;
  --sel: #0b0b0b; --cause: #0b0b0b; --branch: #52514e;
  --body: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.16); --wash: rgba(255,255,255,0.05);
    --r-read: #3987e5; --r-helper: #cf5bb5; --ring-warning: #fab219; --fade-read: .4; --r-req: #a487f0; --req-wash: rgba(164,135,240,0.12);
    --sel: #f0efec; --cause: #f0efec; --branch: #c3c2b7;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.16); --wash: rgba(255,255,255,0.05);
  --r-read: #3987e5; --r-helper: #cf5bb5; --ring-warning: #fab219; --fade-read: .4; --r-req: #a487f0; --req-wash: rgba(164,135,240,0.12);
  --sel: #f0efec; --cause: #f0efec; --branch: #c3c2b7;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 var(--body); }
[hidden] { display: none !important; }
.wrap { padding: 16px; display: grid; gap: 14px; max-width: 1600px; margin: 0 auto; }
header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-start; justify-content: space-between; }
h1 { font-size: 20px; margin: 0; font-weight: 650; }
h2 { font-size: 13px; margin: 0 0 8px; font-weight: 650; color: var(--ink2); text-transform: uppercase; letter-spacing: .06em; }
.hright { display: grid; gap: 6px; justify-items: end; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
.keys { font-size: 12px; color: var(--ink2); }
kbd { font: 11px var(--mono); border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; background: var(--surface); color: var(--ink); }
select, button, .file { font: 500 13px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.file { position: relative; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
.file:focus-within, :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.notice { font-size: 13px; color: var(--ink2); border-left: 3px solid var(--ring-warning); padding: 2px 8px; }
/* the header of the selected turn or design */
.why { display: flex; gap: 10px; align-items: flex-start; font-size: 18px; font-weight: 600; line-height: 1.4; overflow-wrap: anywhere; }
.why .di { width: 22px; height: 22px; font-size: 13px; margin-top: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12.5px; color: var(--ink2); margin-top: 6px; }
.meta .mono { font-size: 12px; }
.lin { font-size: 12.5px; color: var(--ink2); margin-top: 6px; overflow-wrap: anywhere; }
.lin .main { font: 600 12.5px var(--mono); color: var(--ink); }
.lin .br { font: 12px var(--mono); color: var(--ink2); }
.lin .k, .meta .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; margin-right: 6px; }
.why .defect, .meta .defect { color: var(--critical); font-weight: 700; }
/* decision icons: decided, undecided by marker kind, no decision */
.di { display: inline-grid; place-items: center; width: 17px; height: 17px; border-radius: 50%; font: 700 10.5px var(--body); color: #fff; flex: none; vertical-align: middle; }
.di.decided { background: var(--good); } .di.Unsure { background: var(--warning); color: #0b0b0b; }
.di.Unavailable { background: var(--critical); } .di.Unasked { background: var(--neutral); }
.di.none { background: transparent; color: var(--neutral); border: 1.5px solid var(--neutral); font-size: 11px; }
/* entry chips in the detail */
.st { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.st i { font-style: normal; display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; font-size: 10px; font-weight: 700; color: #fff; }
.st.value i { background: var(--good); } .st.Unsure i { background: var(--warning); color: #0b0b0b; }
.st.Unasked i { background: var(--neutral); } .st.Unavailable i { background: var(--critical); }
.st.absent i { background: transparent; border: 1.5px dashed var(--ink2); color: var(--ink2); }
.st.nobounds i { background: transparent; border: 1.5px solid var(--neutral); }
.st.det i { display: none; }
.st.nobounds i::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--neutral); }
.st.short i { background: var(--warning); color: #0b0b0b; border-radius: 0; clip-path: polygon(50% 0, 100% 100%, 0 100%); padding-top: 3px; font-size: 9px; }
/* the legend: two muted groups, and the glossary */
.skel-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
.lgwrap { position: relative; display: flex; gap: 10px; align-items: flex-start; margin-left: auto; }
.legend { display: grid; gap: 4px; justify-items: end; font-size: 12px; color: var(--ink2); }
.lg-row { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; justify-content: flex-end; }
.lg-k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.legend svg { vertical-align: middle; }
.legend button.toggle { font-size: 12px; padding: 2px 8px; display: inline-flex; align-items: center; gap: 4px; color: var(--ink2); }
.legend button.toggle[aria-pressed="true"] { color: var(--ink); }
.gloss-btn { width: 24px; height: 24px; padding: 0; border-radius: 50%; font-weight: 700; flex: none; }
#gloss { position: absolute; right: 0; top: 30px; z-index: 15; width: min(620px, 92vw); max-height: 70vh; overflow: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.22); padding: 8px 12px; font-size: 12.5px; }
#gloss dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 0; }
#gloss dt { font-weight: 650; } #gloss dd { margin: 0; color: var(--ink2); }
.canvas { overflow-x: auto; overflow-y: hidden; }
.canvas svg { display: block; font-family: var(--body); }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }
.stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; color: var(--ink2); font-size: 11.5px; }
.detail td { overflow-wrap: anywhere; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); font-size: 12px; }
.muted { color: var(--ink2); }
/* the turns table */
#turns { overflow-x: auto; }
#turns table { font-size: 12px; }
#turns td { white-space: nowrap; }
#turns th, #turns td { padding: 4px 4px; }
#turns th { white-space: nowrap; }
#turns td.wr { white-space: normal; }
#turns .cl { display: flex; gap: 4px; align-items: center; white-space: nowrap; }
#turns .sub { display: block; font: 11px var(--body); color: var(--ink2); }
#turns .nob { color: var(--muted); font-style: italic; }
#turns tbody tr { cursor: pointer; }
#turns tbody tr:hover { background: var(--wash); }
#turns tbody tr[aria-selected="true"] { background: var(--wash); box-shadow: inset 3px 0 0 var(--ink); }
#turns th button.sort { all: unset; cursor: pointer; }
#turns th button.sort:focus-visible { outline: 2px solid var(--ink); }
#turns th[aria-sort="ascending"] button.sort::after { content: ' ▲'; font-size: 9px; }
#turns th[aria-sort="descending"] button.sort::after { content: ' ▼'; font-size: 9px; }
#turns tfoot td { white-space: normal; border-bottom: none; color: var(--ink2); font-size: 12px; padding-top: 8px; }
#turns tfoot .mono { font-size: 11.5px; }
#turns tfoot .k { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 2px; }
.ties { font: 600 12.5px var(--mono); margin-bottom: 4px; }
.tbar { display: flex; gap: 10px; align-items: center; margin-bottom: 6px; font-size: 12px; color: var(--ink2); }
.tbar button { font-size: 12px; padding: 2px 8px; }
.chip { cursor: pointer; } .chip:hover { text-decoration: underline; }
/* the detail */
.detail h3 { font-size: 15px; margin: 0 0 2px; font-family: var(--mono); }
.detail .sub { color: var(--ink2); font-size: 12px; margin-bottom: 8px; }
.detail dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 10px; margin: 0 0 8px; font-size: 12.5px; }
.detail dt { color: var(--ink2); }
.detail dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.detail .q { border-top: 1px solid var(--grid); padding-top: 6px; margin-top: 6px; }
.detail tr.hit td { background: var(--wash); font-weight: 650; }
.detail tr.hov td { background: var(--wash); }
.detail tr.hov td:first-child { box-shadow: inset 3px 0 0 var(--ink); }
.tblwrap { overflow-x: auto; }
.tblwrap td, .tblwrap th { white-space: nowrap; min-width: max-content; overflow-wrap: normal; }
.tag { display: inline-block; font: 10.5px var(--mono); border: 1px solid var(--border); border-radius: 3px; padding: 0 4px; margin: 0 3px 2px 0; cursor: pointer; color: var(--ink2); background: var(--surface); }
.tag:hover { color: var(--ink); border-color: var(--ink2); }
.intext { float: right; font-size: 11.5px; padding: 2px 8px; }
/* the text pane */
.text { font: 12px/1.5 var(--mono); background: var(--page); border: 1px solid var(--grid); border-radius: 6px; max-height: 560px; overflow: auto; padding: 6px 0; }
.text div { white-space: pre; padding: 0 10px; min-height: 1.5em; }
.text div.lin { box-shadow: inset 3px 0 0 var(--ink2); }
.text div.hl { background: var(--wash); box-shadow: inset 3px 0 0 var(--ink); }
.text div.hl1 { font-weight: 700; }
.text div.node { cursor: pointer; }
.text div.node:hover { text-decoration: underline; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); color: var(--ink); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.18); max-width: 460px; white-space: pre-wrap; }
#drop { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: grid; place-items: center; color: #fff; font-size: 20px; z-index: 20; }
/* SVG marks */
.node-box { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
.node-box.policy { stroke: var(--ink); stroke-width: 2; }
.node-g { cursor: pointer; }
.node-g:hover .node-box:not(.policy):not(.inner) { stroke: var(--ink2); }
.node-g:focus { outline: none; }
.node-g:focus-visible .node-box, .node-g.sel .node-box:not(.inner) { stroke: var(--sel); stroke-width: 2.5; }
.cap { font-size: 10.5px; letter-spacing: .07em; fill: var(--ink2); text-transform: uppercase; }
.name { font-size: 13px; font-weight: 650; fill: var(--ink); }
.row-label { font-size: 12px; fill: var(--ink); }
.row-brief { font-size: 11.5px; fill: var(--ink2); font-family: var(--mono); }
.row-brief.strong { fill: var(--ink); font-weight: 700; }
.badge { font-size: 10.5px; fill: var(--ink2); font-family: var(--mono); }
.badge.warn { fill: var(--ink); font-weight: 700; }
.tgbox { fill: none; stroke: var(--axis); }
.tgtag { font-size: 10.5px; fill: var(--ink2); font-family: var(--mono); }
.group-ol { fill: none; stroke: var(--ink2); stroke-dasharray: 3 3; stroke-width: 1; }
.group-lab { font-size: 10px; font-weight: 600; letter-spacing: .02em; font-variant-caps: all-small-caps; fill: var(--ink2); }
.group-lab-bg { fill: var(--surface); }
.glyph { fill: var(--ink2); stroke: none; }
.glyph.open { fill: none; stroke: var(--ink2); stroke-width: 1.3; }
.tick { stroke: var(--ink2); stroke-width: 1.5; }
.colhead { font-size: 10.5px; fill: var(--ink2); letter-spacing: .02em; }
.band { fill: var(--wash); stroke: none; }
.bandhead { font-size: 12px; font-weight: 650; fill: var(--ink); letter-spacing: .03em; }
.bandfoot { font-size: 11px; fill: var(--ink2); font-family: var(--mono); }
.bandfoot.cut { fill: var(--ink); font-weight: 650; }
.pill { fill: var(--ink); stroke: none; }
.pill-t { font-size: 10.5px; font-weight: 700; fill: var(--surface); letter-spacing: .04em; }
.colrule { stroke: var(--grid); }
.edge { fill: none; stroke-width: 1.6; }
.edge.hit { stroke: transparent; stroke-width: 10; }
.edge.state { stroke: var(--muted); stroke-width: 1; opacity: .7; }
.edge.r-read { stroke: var(--r-read); }
.edge.r-helper { stroke: var(--r-helper); stroke-dasharray: 7 3; }
.edge.r-source-requirement { stroke: var(--r-req); stroke-dasharray: 9 3 2 3; }
.edge.r-need { stroke-dasharray: 4 3; } .edge.r-slot { stroke-dasharray: 1.5 3; }
.edge.r-text { stroke-dasharray: 8 2 1.5 2; } .edge.r-label-set { stroke-dasharray: 4 2 1 2; }
.edge.r-grounding { stroke-dasharray: 10 3; }
.edge.trunk { stroke-width: 3.2; stroke-linecap: round; }
.edge.eng-other { stroke: var(--ink2); }
.overlay .edge:not(.hit):not(.lineage):not(.branch) { opacity: var(--fade); }
.overlay .edge.r-read:not(.hit) { opacity: var(--fade-read); }
.focus .edge.dim { opacity: .14; }
.edge.lineage { stroke: var(--cause); stroke-width: 2.6; opacity: 1; stroke-dasharray: none; }
.edge.branch { stroke: var(--branch); stroke-width: 1.5; opacity: 1; stroke-dasharray: none; }
.edge.lineage.declared, .edge.branch.declared { stroke-dasharray: 5 4; }
.canvas .edge.hov:not(.hit) { opacity: 1 !important; stroke-width: 2.4; }
.row-path { fill: none; stroke: var(--cause); stroke-width: 1.6; pointer-events: none; }
.strip-path { fill: var(--cause); }
.ah { fill: var(--muted); } .ah.r-read { fill: var(--r-read); } .ah.r-helper { fill: var(--r-helper); }
.ah.r-source-requirement { fill: var(--r-req); } .ah.eng-other { fill: var(--ink2); } .ah.lineage { fill: var(--cause); } .ah.branch { fill: var(--branch); }
.wash-value { fill: var(--good); } .wash-Unsure { fill: var(--warning); } .wash-Unasked { fill: var(--neutral); }
.wash-Unavailable { fill: var(--critical); } .wash-short { fill: var(--warning); }
.wash-nobounds { fill: var(--neutral); }
.bar-value { fill: var(--good); } .bar-Unsure { fill: var(--warning); } .bar-Unasked { fill: var(--neutral); }
.bar-Unavailable { fill: var(--critical); } .bar-short { fill: var(--warning); }
.ring-Unsure, .ring-short { stroke: var(--ring-warning) !important; stroke-width: 2; }
.ring-Unavailable { stroke: var(--critical) !important; stroke-width: 2; }
.ring-absent { stroke-dasharray: 4 3; }
.icon-bg { stroke: none; } .icon-t { font-size: 9px; font-weight: 700; fill: #fff; text-anchor: middle; }
.icon-t.dark { fill: #0b0b0b; }
.absent-ring { fill: none; stroke: var(--ink2); stroke-dasharray: 2 2; }
.nb-ring { fill: none; stroke: var(--neutral); stroke-width: 1.5; } .nb-dot { fill: var(--neutral); }
.side-clear { fill: var(--good); stroke: var(--good); } .side-short { fill: var(--warning); stroke: var(--warning); }
.side-none { fill: var(--ink2); stroke: var(--ink2); }
.strip-axis { stroke: var(--axis); } .strip-grid { stroke: var(--grid); } .strip-sep { stroke: var(--axis); }
.strip-bound { stroke: var(--ink); stroke-width: 2; }
.strip-t { font-size: 11px; fill: var(--ink2); } .strip-l { font-size: 12px; fill: var(--ink); font-family: var(--mono); }
.strip-b { font-weight: 700; fill: var(--ink); font-family: var(--mono); } .strip-m { fill: var(--ink2); font-size: 11.5px; }
.strip-row { cursor: pointer; } .strip-row:hover .strip-bg { fill: var(--wash); } .strip-bg { fill: transparent; }
.strip-row.root .strip-bg { fill: var(--wash); } .strip-row.root .strip-l { font-weight: 700; }
@keyframes flash { 0% { fill: var(--ring-warning); fill-opacity: .5; } 100% { fill-opacity: 0; } }
.strip-row.flash .strip-bg { animation: flash 1.4s ease-out; }

/* the tabs */
nav.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin: 2px 0 10px; }
nav.tabs button[aria-selected="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 650; }
nav.tabs button:disabled { opacity: .45; cursor: default; }
/* the design views: overview, explore, targets, outcomes */
.dv { min-width: 0; }
.dv h2.vh { font-size: 17px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0 0 6px; }
.dv .lede { color: var(--ink2); max-width: 82ch; margin: 0 0 16px; }
.dv .ref { font: 12.5px var(--mono); background: var(--wash); color: var(--ink); border: 1px solid transparent; border-radius: 4px; padding: 1px 6px; cursor: pointer; white-space: nowrap; }
.dv .ref:hover, .dv .ref:focus-visible { border-color: var(--ink2); }
.dv .ref.source { background: transparent; border-color: var(--border); }
.dv .ref.policy { background: transparent; border: 1px solid var(--ink); box-shadow: inset 0 0 0 1px var(--ink); font-weight: 650; }
.dv .chip { display: inline-block; font: 11px var(--mono); padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--ink2); }
.dv .chip.unknown { border-style: dashed; }
.dv .chip.asks { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.dv .mono { font: 12.5px var(--mono); }
.dv details { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); margin-bottom: 8px; }
.dv details > summary { list-style: none; cursor: pointer; padding: 10px 14px; display: grid; gap: 4px; }
.dv details > summary::-webkit-details-marker { display: none; }
.dv details[open] > summary { border-bottom: 1px solid var(--grid); }
.dv details .body { padding: 10px 14px 14px; display: grid; gap: 10px; }
.dv .flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.dv .arrow { color: var(--muted); }
.dv .kk { font: 11px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); }
.dv .when { font: 12px var(--mono); color: var(--r-req); }
.dv .warnline { color: var(--ink2); font-size: 12px; font-style: italic; }
.dv .ovw p { max-width: 84ch; margin: 0 0 12px; line-height: 1.9; }
.dv .stats { display: flex; gap: 22px; flex-wrap: wrap; margin: 8px 0 22px; }
.dv .stats div { display: grid; } .dv .stats b { font: 22px var(--mono); } .dv .stats span { font-size: 12px; color: var(--ink2); }
.dv .troot { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border: 2px solid var(--ink); border-radius: 8px; background: var(--surface); margin-bottom: 10px; max-width: 1000px; }
.dv .tlist { border-left: 2px solid var(--grid); margin-left: 18px; padding-left: 16px; max-width: 1000px; }
.dv .trow { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.dv .trow .tid { font: 600 13px var(--mono); }
.dv .trow .stmt { color: var(--ink2); flex-basis: 100%; font-size: 13px; }
.dv .matrix { overflow: auto; max-width: 100%; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.dv .matrix table { border-collapse: collapse; font: 11.5px var(--mono); }
.dv .matrix th, .dv .matrix td { border: 1px solid var(--grid); padding: 3px 5px; text-align: center; white-space: nowrap; }

<script>
'use strict';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'})[c]);
function svg(tag, attrs, parent, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}
const enc = v => { const s = JSON.stringify(v); return s === undefined ? String(v) : s; };
const cut = (s, n) => (s = String(s), s.length > n ? s.slice(0, Math.max(1, n - 1)) + '…' : s);
const fitChars = (px, size) => Math.max(3, Math.floor(px / (size * 0.6)));
const REF = /^([qtd]):([^.\[\]]+)/;
const baseOf = r => { const m = typeof r === 'string' && REF.exec(r); return m ? m[1] + ':' + m[2] : null; };
const basename = p => String(p || '').split('/').pop();
const num = x => typeof x === 'number' ? String(+x.toPrecision(6)) : String(x);

/* ---------- data ---------- */
const OUTLINE_VERSION = 8;
let DATA = {sets: []};
try {
  const raw = $('lens-data').textContent.trim();
  if (raw.startsWith('{')) DATA = JSON.parse(raw);
} catch (err) { showNotice('The embedded data did not parse: ' + err.message); }

// Every bound of an entry as one row; a thresholds bound gives one row per label.
function boundRows(e) {
  const rows = [];
  for (const b of e.bounds || []) {
    if (b.per_label) for (const p of b.per_label) rows.push({e, role: b.role, label: `threshold ${p.label}`, by: b.by, param: b.param, bound: p.threshold, measured: p.probability, distance: p.distance, side: p.side, measure: 'p(' + p.label + ')'});
    else rows.push({e, role: b.role, label: b.role + (b.key ? ' ' + b.key : ''), by: b.by, param: b.param, bound: b.bound, measured: b.measured, distance: b.distance, side: b.side, measure: b.measure});
  }
  return rows;
}
// An entry's mark. A value is determined: the green check when it has bounds and every one is
// clear, the amber ! when its nearest bound is short, the neutral mark for a question whose
// paired design declares no bound (`bounds: []`), and no mark (`det`) for any other value: a
// state field, a tool result, a rule's value, or any value with no design paired. A marker or
// absence is itself.
function dispState(e) {
  if (!e) return null;
  if (e.holds !== 'value') return e.holds;
  const rows = boundRows(e);
  if (rows.some(b => b.side === 'short') || (e.nearest && e.nearest.side === 'short')) return 'short';
  if (rows.length) return 'value';

    if (S.sort) h.set('sort', (S.dir < 0 ? '-' : '') + S.sort);
    if (theme !== 'auto') h.set('theme', theme);
    if (EX.up !== 1) h.set('up', String(EX.up));
    if (EX.down !== 1) h.set('down', String(EX.down));
    if (EX.dir === 'h') h.set('dir', 'h');
    if (EX.info) h.set('info', '1');
    if (S.table) h.set('table', S.table);
    if (S.tmode) h.set('tmode', S.tmode);
    const next = '#' + h.toString();
    if (location.hash !== next) { if (push) history.pushState(null, '', next); else history.replaceState(null, '', next); }
  } catch (e) { /* no location or history (file sandbox, test stub) */ }
}
function showNotice(msg) { const n = $('notice'); n.textContent = msg || ''; n.hidden = !msg; }
function applyTheme() {
  if (theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', theme);
  const b = $('theme'); if (b) b.textContent = 'theme: ' + theme;
}
/* ---------- loading files ---------- */
function parseOutlines(text, name) {
  let objs = [];
  try { const j = JSON.parse(text); objs = Array.isArray(j) ? j : [j]; }
  catch (e) { for (const line of text.split('\n')) if (line.trim()) objs.push(JSON.parse(line)); }
  const out = [];
  for (const o of objs) {
    if (o && Array.isArray(o.sets)) { for (const s of o.sets) for (const d of s.docs || []) out.push(d); continue; }
    if (o && o.outline && o.outline.outline_version === OUTLINE_VERSION) out.push({path: o.path || name, outline: o.outline, text: o.text || null});
    else if (o && o.outline_version === OUTLINE_VERSION) out.push({path: name, outline: o, text: null});
  }
  return out;
}
async function loadFiles(files) {
  const docs = [], bad = [];
  for (const f of files) {
    try { const got = parseOutlines(await f.text(), f.name); if (!got.length) bad.push(f.name); docs.push(...got); }
    catch (e) { bad.push(f.name + ' (' + e.message + ')'); }
  }
  if (!docs.length) { showNotice('Nothing drawable in ' + bad.join(', ') + ': expected outline JSON from python -m ommat.outline --json.'); return; }
  sets.push(prepareSet({name: 'opened: ' + [...files].map(f => f.name).join(', '), docs}));
  fillSetPick(); S.set = sets.length - 1; S.design = 0; S.turn = null; S.node = null; render();
  if (bad.length) showNotice('Skipped ' + bad.join(', ') + '.');
}
function fillSetPick() {
  const p = $('setPick'); p.textContent = '';
  sets.forEach((s, i) => { const o = document.createElement('option'); o.value = i; o.textContent = s.name || 'set ' + (i + 1); p.appendChild(o); });
  p.value = S.set;
}

/* ---------- wiring ---------- */
$('setPick').addEventListener('change', ev => { S.set = +ev.target.value; S.design = 0; S.turn = null; S.node = null; render(); });
$('turnPick').addEventListener('change', ev => { const v = ev.target.value; S.turn = v === '' ? null : +v; S.node = null; render(); });
$('prev').addEventListener('click', () => step(-1));
$('next').addEventListener('click', () => step(1));
$('fileIn').addEventListener('change', ev => { if (ev.target.files.length) loadFiles(ev.target.files); ev.target.value = ''; });
$('theme').addEventListener('click', () => {
  theme = {auto: 'light', light: 'dark', dark: 'auto'}[theme] || 'auto';
  try { localStorage.setItem('ommat-lens-theme', theme); } catch (e) { /* storage blocked */ }
  applyTheme(); writeHash();
});
$('copy').addEventListener('click', () => {
  writeHash();
  const b = $('copy'), done = ok => { b.textContent = ok ? 'link copied' : 'copy failed'; setTimeout(() => { b.textContent = 'copy link'; }, 1400); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(() => done(true), () => done(false));
    else { const a = document.createElement('textarea'); a.value = location.href; document.body.appendChild(a); a.select(); done(document.execCommand('copy')); a.remove(); }
  } catch (e) { done(false); }
});
for (const v of VIEWS) $('tab-' + v).addEventListener('click', () => showView(v));
$('views').addEventListener('click', viewsClick);
$('views').addEventListener('pointerover', viewsHover);
$('views').addEventListener('pointerleave', () => { clearTimeout(hoverT); $('hovercard').hidden = true; });
$('views').addEventListener('change', ev => {
  const el = ev.target, X = ixOf(curDesign());
  if (!el || !X) return;
  if (el.id === 'tsel') { S.table = el.value; drawView(); writeHash(); }
  if (el.id === 'exsearch') { const n = (X.D.nodes || []).find(x => x.name === el.value || x.id === el.value); if (n) go(n.id); }
});
$('views').addEventListener('input', ev => {
  const el = ev.target, X = ixOf(curDesign());
  if (!el || el.id !== 'sbfilter' || !X) return;
  EX.filter = el.value;
  $('sb').innerHTML = sidebarHTML(X, curTurn(), exFocus(X));
  const inp = $('sbfilter'); if (inp.focus) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
});
$('glossBtn').addEventListener('click', () => { const g = $('gloss'); g.hidden = !g.hidden; $('glossBtn').setAttribute('aria-expanded', String(!g.hidden)); });
$('detail').addEventListener('click', ev => {
  const el = ev.target && ev.target.closest ? ev.target.closest('[data-node], [data-intext]') : null;
  if (!el) return;
  if (el.hasAttribute('data-intext')) scrollTextToSelection(); else selectNode(el.getAttribute('data-node'));
});
document.addEventListener('pointerover', tipAt);
document.addEventListener('pointermove', ev => { if (!TIP.hidden) moveTip(ev); });
document.addEventListener('pointerleave', () => { TIP.hidden = true; });
document.addEventListener('keydown', ev => {
  const tag = (ev.target && ev.target.tagName) || '';
  if (/^(INPUT|SELECT|TEXTAREA)$/.test(tag)) { if (ev.key === 'Escape' && ev.target.blur) ev.target.blur(); return; }
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if (S.view === 'explore' && exploreKey(ev)) return;
  if (ev.key === 'ArrowRight' || ev.key === 'j') { ev.preventDefault(); step(1); }
  else if (ev.key === 'ArrowLeft' || ev.key === 'k') { ev.preventDefault(); step(-1); }
  else if (ev.key === 'Escape') { if (!$('gloss').hidden) { $('gloss').hidden = true; $('glossBtn').setAttribute('aria-expanded', 'false'); } else if (S.node) S.node = null; else S.turn = null; render(); }
});
let dragDepth = 0;
addEventListener('dragenter', ev => { ev.preventDefault(); dragDepth++; $('drop').hidden = false; });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; $('drop').hidden = true; } });
addEventListener('dragover', ev => ev.preventDefault());
addEventListener('drop', ev => { ev.preventDefault(); dragDepth = 0; $('drop').hidden = true; if (ev.dataTransfer && ev.dataTransfer.files.length) loadFiles(ev.dataTransfer.files); });
let resizeT = null;
addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(render, 150); });

// The view a link with no view opens: the overview of a design, or the graph for records alone.
function defaultView() { return cur().turns.length ? 'turn' : cur().designs.length ? 'overview' : 'graph'; }
// A hash such as #view=explore&node=rule:act&up=2&turn=2&theme=dark&sort=-nearest&und=1 opens that view.
function readHash() {
  Object.assign(S, {view: null, turn: null, node: null, stateEdges: false, declaredHops: true, undecidedOnly: false, sort: null, dir: 1});
  try {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has('set')) { const i = sets.findIndex(s => s.name === h.get('set')); S.set = i >= 0 ? i : Math.min(+h.get('set') || 0, sets.length - 1); }
  if (h.has('turn')) S.turn = Math.min(+h.get('turn'), cur().turns.length - 1);
  if (h.has('node')) S.node = h.get('node');
  if (h.has('theme')) { theme = h.get('theme'); applyTheme(); }
  if (h.has('state')) S.stateEdges = h.get('state') === '1';
  if (h.has('und')) S.undecidedOnly = h.get('und') === '1';
  if (h.has('sort')) { const k = h.get('sort'); S.dir = k.startsWith('-') ? -1 : 1; S.sort = SORTS[k.replace(/^-/, '')] ? k.replace(/^-/, '') : null; }
  if (VIEWS.includes(h.get('view'))) S.view = h.get('view');
  const depth = k => { const v = Number(h.get(k)); return h.has(k) && isFinite(v) ? Math.max(0, Math.min(99, Math.round(v))) : 1; };
  EX.up = depth('up'); EX.down = depth('down');
  EX.dir = h.get('dir') === 'h' ? 'h' : 'v';
  EX.info = h.get('info') === '1';
  S.table = h.get('table') || null;
  S.tmode = h.get('tmode') === 'matrix' ? 'matrix' : null;
  } catch (e) { /* no usable hash */ }
  if (!S.view) S.view = defaultView();
}
try { EX.mini = localStorage.getItem('ommat-lens-map') !== '0'; } catch (e) { /* storage blocked */ }
readHash();
// a page given records, with no turn or view in its link, opens on its first turn
{ let hs = ''; try { hs = location.hash || ''; } catch (e) { /* no location */ } const h = new URLSearchParams(hs.slice(1)); if (S.turn === null && !h.has('turn') && !h.has('view') && cur().turns.length) S.turn = cur().order[0]; }
// back and forward walk Explore's focus moves; a pasted hash opens its view
let lastHash = null;
const onHistory = () => { let h = null; try { h = location.hash; } catch (e) { return; } if (h === lastHash) return; lastHash = h; readHash(); render(); };
addEventListener('popstate', onHistory);
addEventListener('hashchange', onHistory);
fillGlossary();
fillSetPick();
render();
</script>
