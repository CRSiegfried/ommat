# Lint, type-check and test on every push to main and every pull request; check commit
# subjects on pushes to main.
# Actions are pinned to full commit SHAs; Dependabot keeps them current.
#
# The idia extra resolves through [tool.uv.sources] to idia's release tag v0.2.0 on GitHub,
# which uv fetches at the sync. Each job checks this repository out at ommat/. No job makes a
# live call.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ommat

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ommat
          persist-credentials: false
          fetch-depth: 0  # the subjects check reads the commits a push adds
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          working-directory: ommat
      - run: uv sync --locked --all-extras
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - name: Commit subjects describe library changes
        if: github.event_name == 'push'
        env:
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          # A new branch's push has no earlier commit: check the pushed commit alone.
          if ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE="$HEAD~1"; fi
          git log --format=%s "$BASE..$HEAD" | uv run python scripts/check_subjects.py

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    # The suite takes under five minutes on every leg; a hang ends here, not at GitHub's six
    # hours, and pytest's faulthandler_timeout has dumped every thread's stack by then.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ommat
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python }}
          working-directory: ommat
      - run: uv sync --locked --all-extras
      - run: uv run pytest --cov -m "not slow"

  # The slow tests, in a job of their own so a hang names itself in the checks, on one Linux and
  # one Windows leg rather than the whole matrix.
  slow:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ommat
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.11"
          working-directory: ommat
      - run: uv sync --locked --all-extras
      - run: uv run pytest -m slow

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ommat
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: ommat
      - run: uv build
      - run: uvx twine check --strict dist/*

  # The one check branch protection requires: it passes only when every job above succeeded, so
  # a matrix leg that failed, was cancelled or never got a runner holds the merge.
  ci-ok:
    if: always()
    needs: [lint, test, slow, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done
