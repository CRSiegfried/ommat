[project]
name = "ommat"
version = "0.4.0"
description = "Gather evidence from a decision model, compile one checked plan, and record the turn so it replays; the caller runs the plan."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Siegfried", email = "160437306+CRSiegfried@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["blackboard", "decision model", "planning", "llm", "agents", "rules engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/CRSiegfried/ommat"
Documentation = "https://github.com/CRSiegfried/ommat/tree/main/docs"
Repository = "https://github.com/CRSiegfried/ommat"
Issues = "https://github.com/CRSiegfried/ommat/issues"
Changelog = "https://github.com/CRSiegfried/ommat/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The binding to idia, ommat.bindings.idia.
idia = ["idia>=0.1,<0.2"]
# The Pydantic AI renderer, ommat.conversation.pydantic_ai.
pydantic-ai = ["pydantic-ai-slim>=2.49"]

[tool.uv.sources]
# Development only: idia from the sibling checkout. uv keeps this out of the built metadata.
idia = { path = "../idia", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "rfc8785>=0.1.4",
    # The live recordings of the binding's end-to-end logs call OpenAI and Cloudflare.
    "idia[openai,cloudflare]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["docs/tutorials/write_a_design", "docs/tutorials/street_reports", "docs/tutorials/decide_with_idia", "docs/how-to/add_a_source", "docs/how-to/hand_off_context", "docs/how-to/gate_a_source"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "slow: a test that takes about a minute, run in its own CI step without coverage",
]

[tool.coverage.run]
source = ["ommat"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
src = ["src", "tests", "docs/tutorials/write_a_design", "docs/tutorials/street_reports", "docs/tutorials/decide_with_idia", "docs/how-to/add_a_source", "docs/how-to/hand_off_context", "docs/how-to/gate_a_source"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
]

[tool.pyright]
include = ["src", "tests", "docs/tutorials", "docs/how-to", "scripts"]
extraPaths = ["src", "tests", "scripts", "docs/tutorials/write_a_design", "docs/tutorials/street_reports", "docs/tutorials/decide_with_idia", "docs/how-to/add_a_source", "docs/how-to/hand_off_context", "docs/how-to/gate_a_source"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/*.md", "/LICENSE", "/scripts", "/skills"]
