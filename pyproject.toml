[project]
name = "ommat"
version = "0.5.0"
description = "Gather evidence from a judgement model onto a blackboard, fire the rules, and record the turn so it replays."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Christopher Siegfried", email = "160437306+CRSiegfried@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = []
keywords = ["blackboard", "judgement model", "llm", "agents", "rules engine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/CRSiegfried/ommat"
Documentation = "https://github.com/CRSiegfried/ommat/tree/main/docs"
Repository = "https://github.com/CRSiegfried/ommat"
Issues = "https://github.com/CRSiegfried/ommat/issues"
Changelog = "https://github.com/CRSiegfried/ommat/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# The binding to idia, ommat.bindings.idia.
idia = ["idia>=0.2,<0.3"]
# The Pydantic AI renderer, ommat.conversation.pydantic_ai.
pydantic-ai = ["pydantic-ai-slim>=2.49"]

[tool.uv.sources]
# idia from its published tag, so `uv add` and `uv pip install` of ommat from git resolve it.
# uv keeps this out of the built metadata; CONTRIBUTING says how to develop against a checkout.
idia = { git = "https://github.com/CRSiegfried/idia", tag = "v0.2.0" }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.14",
    "pyright>=1.1.400",
    "rfc8785>=0.1.4",
    # The live recordings of the binding's end-to-end logs call OpenAI and Cloudflare.
    "idia[openai,cloudflare]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["docs/tutorials/write_a_design", "docs/tutorials/street_reports", "docs/tutorials/decide_with_idia", "docs/how-to/add_a_source", "docs/how-to/hand_off_a_turn", "docs/how-to/gate_a_source", "docs/how-to/read_a_record", "docs/how-to/combine_designs", "docs/how-to/lay_out_a_design"]
addopts = ["--strict-markers", "--strict-config"]
xfail_strict = true
# A test still running after this many seconds dumps every thread's stack, so a hang in CI
# shows where it is before the job's timeout ends it.
faulthandler_timeout = 300
filterwarnings = ["error"]
markers = [
    "slow: a test that takes about a minute, run in its own CI job without coverage",
]

[tool.coverage.run]
source = ["ommat"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 100
src = ["src", "tests", "docs/tutorials/write_a_design", "docs/tutorials/street_reports", "docs/tutorials/decide_with_idia", "docs/how-to/add_a_source", "docs/how-to/hand_off_a_turn", "docs/how-to/gate_a_source", "docs/how-to/read_a_record", "docs/how-to/combine_designs", "docs/how-to/lay_out_a_design"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "C4",       # comprehensions
    "PT",       # pytest style
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
]

[tool.pyright]
include = ["src", "tests", "docs/tutorials", "docs/how-to", "scripts"]
extraPaths = ["src", "tests", "scripts", "docs/tutorials/write_a_design", "docs/tutorials/street_reports", "docs/tutorials/decide_with_idia", "docs/how-to/add_a_source", "docs/how-to/hand_off_a_turn", "docs/how-to/gate_a_source", "docs/how-to/read_a_record", "docs/how-to/combine_designs", "docs/how-to/lay_out_a_design"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/*.md", "/LICENSE", "/scripts", "/skills"]
